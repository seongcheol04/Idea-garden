<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f1"><title>moru — 생각을 키우는 공간</title>
<style>

:root{--ink:#34443d;--muted:#8a968e;--sage:#8eaf9b;--sage2:#e4efe5;--cream:#f8f7f1;--line:#e8eae2;--white:#fffefa;--lav:#efebf7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif;color:var(--ink)}body{background:var(--cream);overflow-x:hidden}.blob{position:fixed;border-radius:50%;filter:blur(4px);pointer-events:none;z-index:-1;opacity:.65}.blob.a{width:400px;height:400px;background:radial-gradient(circle,#dae9d7aa,transparent 68%);top:-210px;right:-80px}.blob.b{width:380px;height:380px;background:radial-gradient(circle,#f0e2d7aa,transparent 68%);bottom:-210px;left:-130px}.blob.c{width:300px;height:300px;background:radial-gradient(circle,#e9e2f4aa,transparent 68%);top:37%;left:-200px}
.shell{max-width:720px;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:0 28px}.top{height:100px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;letter-spacing:-1.2px}.logo{width:39px;height:39px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#e5efd9,#d8e8e5);font-size:22px;box-shadow:0 5px 20px #9ebdaa23}.tiny{font-size:11px;letter-spacing:.8px;color:var(--muted);font-weight:600}.reset{border:1px solid var(--line);background:#ffffff9c;color:#718176;border-radius:30px;padding:10px 15px;cursor:pointer;font-size:12px;font-family:inherit}.reset:hover{background:#fff}
.progress-wrap{height:28px;display:flex;align-items:center;gap:12px;margin:0 0 14px}.progress-track{height:4px;background:#e6e9df;border-radius:20px;flex:1;overflow:hidden}.progress-fill{height:100%;background:#a1bfad;width:0%;border-radius:20px;transition:width .5s}.progress-label{font-size:11px;color:#9eaaa0;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;min-height:0}.hero{padding:32px 4px 32px;text-align:center;transition:.3s}.hero .symbol{font-size:34px;display:block;margin-bottom:17px}.hero h1{font-size:clamp(25px,4.5vw,37px);font-weight:600;letter-spacing:-1.7px;line-height:1.55;margin:0}.hero h1 em{font-style:normal;color:#79a38d}.hero p{font-size:13px;color:#94a197;line-height:1.8;margin:12px 0 0}.hero.compact{padding:10px 4px 22px}.hero.compact .symbol{display:none}.hero.compact h1{font-size:20px;letter-spacing:-.7px}.hero.compact p{display:none}
.feed{flex:1;display:flex;flex-direction:column;gap:17px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d7dfd6 transparent;padding:12px 2px 24px;max-height:calc(100dvh - 340px);min-height:240px}.bubble{max-width:90%;font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .25s ease both}.bubble.assistant{align-self:flex-start;background:#fffefaed;border:1px solid #eef0e9;box-shadow:0 10px 36px #566b5210;border-radius:22px 22px 22px 7px;padding:18px 21px}.bubble.user{align-self:flex-end;background:#e5efe5;border-radius:22px 22px 7px 22px;padding:15px 20px;color:#426350}.bubble .who{font-size:11px;color:#99a99b;margin-bottom:7px;display:flex;align-items:center;gap:6px;font-weight:600}.bubble .who i{width:7px;height:7px;background:#a5c6a3;border-radius:50%}.bubble strong{font-weight:700}.option-row{display:flex;flex-wrap:wrap;gap:8px;animation:rise .25s ease both}.pill{padding:12px 15px;border-radius:999px;border:1px solid #dae8dc;background:#fffefa;color:#688574;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}.pill:hover{background:#eaf3e9;transform:translateY(-1px)}.panel{background:#fffefaee;border:1px solid #e7ebe3;border-radius:24px;padding:23px;box-shadow:0 12px 45px #61765a10;animation:rise .3s ease}.panel h3{font-size:18px;letter-spacing:-.5px;margin:0 0 8px}.panel p{font-size:13px;color:#89988a;line-height:1.8;margin:0 0 18px}.choice{width:100%;text-align:left;border:1px solid #edf0e9;border-radius:15px;background:#f9faf6;margin:0 0 9px;padding:14px 16px;cursor:pointer;color:#506659;font-family:inherit;font-size:14px;display:flex;justify-content:space-between;align-items:center}.choice:hover{border-color:#b7ceb7;background:#f0f6ec}.choice small{color:#97a598;font-size:11px}.ready{align-self:stretch;background:linear-gradient(130deg,#ecf4e8,#f4f0f6);border:1px solid #dde8db;border-radius:25px;padding:24px;animation:rise .3s}.ready .eyebrow{font-size:11px;color:#7f9b85;letter-spacing:.8px;font-weight:700}.ready h3{margin:9px 0;font-size:19px;letter-spacing:-.6px}.ready p{color:#708477;font-size:13px;line-height:1.85}.ready-actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:0;border-radius:999px;background:#7ea38c;color:white;padding:12px 19px;font-family:inherit;cursor:pointer;font-size:13px;font-weight:600}.action.secondary{background:#fffefa;color:#698474;border:1px solid #dce8dc}.document{padding:22px;background:white;border:1px solid #e6eae3;border-radius:22px;box-shadow:0 15px 35px #52684d14;animation:rise .3s}.document h2{font-size:23px;line-height:1.5;letter-spacing:-.8px;margin:7px 0 15px}.document section{border-top:1px solid #eef0eb;padding:14px 0}.document h4{margin:0 0 7px;font-size:13px;color:#74907d}.document p{font-size:14px;line-height:1.85;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.document .flag{font-size:11px;color:#a09577}.document button{margin-top:12px}
.compose-wrap{padding:15px 0 max(23px,env(safe-area-inset-bottom));flex-shrink:0;background:linear-gradient(transparent,var(--cream) 18%)}.compose{background:#fffefa;border:1px solid #e5eae2;border-radius:25px;box-shadow:0 13px 45px #576a5512;display:flex;align-items:flex-end;gap:10px;padding:10px 11px 10px 19px}.compose textarea{border:0;outline:none;resize:none;flex:1;min-height:34px;max-height:145px;font-size:14px;line-height:1.7;background:transparent;color:var(--ink);font-family:inherit;padding:5px 0}.compose textarea::placeholder{color:#a4ada3}.send{background:#8dac98;border:0;border-radius:16px;width:41px;height:41px;display:grid;place-items:center;color:white;cursor:pointer;transition:.15s;flex-shrink:0}.send:hover{background:#719b7e}.send:disabled{opacity:.4;cursor:not-allowed}.footer-hint{text-align:center;font-size:10px;color:#a9b2a7;margin-top:11px}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:540px){.shell{padding:0 18px}.top{height:79px}.hero{padding:25px 0}.feed{max-height:calc(100dvh - 295px)}.bubble{font-size:14px}.bubble.assistant{padding:16px 17px}.hero h1{font-size:27px}.ready{padding:20px}}
</style></head>
<body><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<div class="shell"><header class="top"><div class="brand"><span class="logo">🌱</span>moru<span class="tiny">IDEA GARDEN</span></div><button class="reset" id="reset">처음부터 ↗</button></header>
<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="bar"></div></div><span class="progress-label" id="progressLabel">생각의 씨앗</span></div>
<main><div class="hero" id="hero"><span class="symbol">☁️</span><h1>작은 생각도,<br><em>천천히 모양이 돼요.</em></h1><p>아직 말이 안 되는 생각이어도 괜찮아요.<br>하나씩 물어보면서 함께 구체화해 볼게요.</p></div><div class="feed" id="feed" aria-live="polite"></div></main>
<div class="compose-wrap"><div class="compose"><textarea id="input" rows="1" placeholder="문득 떠오른 생각을 적어주세요..." aria-label="아이디어 또는 답변 입력"></textarea><button class="send" id="send" aria-label="보내기"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"/></svg></button></div><div class="footer-hint">아이디어 원문은 그대로 보존돼요 · 이 버전은 AI API 없이 작동하는 데모예요</div></div></div>
<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'moru-working-v3';
  const questions = [
    ['이 생각이 떠오른 계기가 궁금해요. 어떤 순간에 이런 게 있으면 좋겠다고 느꼈나요?', '어떤 상황에서 생각이 떠올랐나요?'],
    ['이 아이디어를 가장 필요로 할 사람은 누구일까요?', '누가 이 아이디어를 사용하게 될까요?'],
    ['그 사람은 지금 이 문제를 어떻게 해결하고 있을까요?', '지금은 어떻게 하고 있을까요?'],
    ['이게 실제로 만들어졌다고 상상해 봐요. 처음 사용하는 순간은 어떤 모습일까요?', '첫 사용 장면을 자유롭게 상상해 봐요.'],
    ['가장 중요한 기능을 딱 하나만 고른다면 무엇일까요?', '제일 먼저 만들 기능은 무엇인가요?'],
    ['그 기능은 어떤 방식으로 작동하면 좋을까요?', '잘 모르겠다면 원하는 결과만 적어도 좋아요.'],
    ['실제로 만들려고 할 때 가장 걱정되는 부분은 무엇인가요?', '기술, 돈, 안전성, 아직 모르는 것...']
  ];
  const toneNames = {warm:'다정한 동반자', playful:'장난기 있는 비평가', analytical:'차분한 설계자'};
  const fields = ['아이디어가 떠오른 계기','목표 사용자','기존 방식','처음 사용하는 장면','가장 중요한 기능','작동 원리','미해결 문제'];
  const $ = id => document.getElementById(id);
  const feed=$('feed'), input=$('input');
  function initial(){ return {idea:'',answers:[],tone:null,phase:'idea',extra:[],plan:false}; }
  let state=initial();
  try {
    const found=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(found && typeof found==='object' && typeof found.idea==='string' && Array.isArray(found.answers) && Array.isArray(found.extra)) {
      state=Object.assign(initial(),found);
    }
  } catch (_) {}
  function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_) {}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function bubble(role,text){
    const div=document.createElement('div'); div.className='bubble '+role;
    if(role==='assistant') div.innerHTML='<div class="who"><i></i> moru</div>'+esc(text).replace(/\n/g,'<br>');
    else div.textContent=text;
    feed.appendChild(div);return div;
  }
  function toneText(text){
    if(state.tone==='playful')return '자, 여기서 살짝 더 파보자. '+text;
    if(state.tone==='analytical')return '다음 항목을 정리해 볼게요. '+text;
    return text;
  }
  function btn(text,click,style='pill'){
    const b=document.createElement('button'); b.className=style;b.type='button';b.textContent=text;b.addEventListener('click',click);return b;
  }
  function formPanel(title,body){
    const p=document.createElement('div');p.className='panel';p.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(body)+'</p>';feed.appendChild(p);return p;
  }
  function render(){
    feed.replaceChildren();
    const n=state.answers.length;
    const completed = state.phase==='offer'||state.phase==='plan'||state.phase==='more';
    $('bar').style.width=(state.idea ? Math.round(Math.min(7,n)/7*100) : 0)+'%';
    $('progressLabel').textContent=state.phase==='plan'?'생각이 문서가 됐어요':completed?'구체화 초안 완성':state.idea?'생각을 키우는 중':'생각의 씨앗';
    $('hero').classList.toggle('compact',!!state.idea);
    if(!state.idea){
      bubble('assistant','안녕! 떠오른 생각을 한 문장만 남겨줘. 아직 막연해도 괜찮아. ☁️');
      input.placeholder='떠오른 생각을 편하게 적어줘...';
    }else{
      bubble('user',state.idea);
      bubble('assistant','좋아. 이 생각을 하나씩 구체화해 보자. 🌱');
      for(let i=0;i<n;i++){
        if(i===2){
          bubble('assistant','잠깐! 앞으로 어떤 말투로 같이 생각해 볼까?');
          bubble('user',toneNames[state.tone]||'다정한 동반자');
        }
        bubble('assistant', i>=2 ? toneText(questions[i][0]) : questions[i][0]);
        bubble('user',state.answers[i]);
      }
      if(state.phase==='tone'){
        bubble('assistant','여기까지 생각해 보니 조금씩 모양이 보이네. 어떤 AI 말투가 좋아?');
        const p=formPanel('같이 이야기할 말투를 골라줘 ✨','무엇을 질문할지는 같고, 말하는 분위기만 달라져.');
        [['warm','☁️ 다정한 동반자','부드럽고 따뜻하게'],['playful','🍋 장난기 있는 비평가','재치 있게, 조금 날카롭게'],['analytical','📐 차분한 설계자','논리적으로 차근차근']].forEach(([id,name,desc])=>{
          const b=btn(name+'  ·  '+desc,()=>{state.tone=id;state.phase='questions';persist();render();},'choice');p.appendChild(b);
        });
      } else if(state.phase==='questions') {
        if(n<questions.length){bubble('assistant',toneText(questions[n][0]));input.placeholder=questions[n][1];}
        else {state.phase='offer';persist();render();return;}
      } else {
        if(state.extra.length){
          bubble('assistant','여기서 조금 더 다듬어 보고 싶은 점이 있으면 말해 줘.');
          state.extra.forEach(x=>bubble('user',x));
        }
        if(state.phase==='offer'){
          bubble('assistant', '처음에는 한 문장이었는데, 이제 누구를 위한 생각인지와 핵심 기능, 작동 방식까지 잡혔어. 아직 검증된 사업이라는 뜻은 아니지만, 기획서 초안을 만들 만큼은 구체화됐어.');
          const p=document.createElement('div');p.className='ready';p.innerHTML='<div class="eyebrow">✦ YOUR IDEA IS GROWING</div><h3>사업계획서 초안으로 묶어볼까?</h3><p>지금까지 답한 내용으로 문서를 만들고, 아직 확인되지 않은 부분은 미검증으로 표시할게.</p>';
          const actions=document.createElement('div');actions.className='ready-actions';
          actions.append(btn('응, 만들어줘 ↗',()=>{state.phase='plan';state.plan=true;persist();render();},'action'));
          actions.append(btn('조금 더 생각할래',()=>{state.phase='more';persist();render();},'action secondary'));
          p.append(actions);feed.append(p);
        }else if(state.phase==='more'){
          bubble('assistant','좋아. 더 구체화하고 싶은 부분을 적어줘. 아직 다 정할 필요는 없어.');
          const row=document.createElement('div');row.className='option-row';
          row.append(btn('이제 사업계획서 만들기',()=>{state.phase='offer';persist();render();}));feed.append(row);
          input.placeholder='더 생각하고 싶은 내용을 적어줘...';
        }else if(state.phase==='plan'){
          bubble('assistant','우리가 나눈 이야기를 한 장의 초안으로 묶었어. 🌿');
          const doc=document.createElement('article');doc.className='document';
          doc.innerHTML='<div class="tiny">MORU · IDEA BLUEPRINT</div><h2>'+esc(state.idea.length>52?state.idea.slice(0,52)+'…':state.idea)+'</h2>';
          const sections=[['아이디어 개요',state.idea],...fields.map((x,i)=>[x,state.answers[i]||'추가 정의 필요'])];
          if(state.extra.length)sections.push(['추가로 발전시킨 내용',state.extra.join('\n')]);
          sections.push(['다음 단계','핵심 기능을 간단히 시험하고, 실제 사용자 반응과 기술적 조건을 확인해 보세요.']);
          sections.forEach(([title,body])=>{const section=document.createElement('section');section.innerHTML='<h4>'+esc(title)+'</h4><p>'+esc(body)+'</p>';doc.append(section);});
          const foot=document.createElement('div');foot.className='flag';foot.textContent='※ 사용자 답변을 정리한 탐색 단계 초안입니다. 시장성과 기술적 실현 가능성은 검증하지 않았습니다.';doc.append(foot);
          doc.append(btn('기획서 저장하기 ↓',downloadPlan,'action'));
          feed.append(doc);
          const row=document.createElement('div');row.className='option-row';row.append(btn('다시 더 구체화하기',()=>{state.phase='more';state.plan=false;persist();render();}));feed.append(row);
          input.placeholder='원하면 내용을 더 추가할 수 있어...';
        }
      }
    }
    const isChoice = state.phase==='tone'||state.phase==='offer';
    input.disabled=isChoice;
    $('send').disabled=isChoice;
    if(isChoice)input.placeholder='위에서 선택해 주세요';
    requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;});
  }
  function submit(){
    if(input.disabled)return;
    const t=input.value.trim();if(!t)return;
    input.value='';resize();
    if(!state.idea){state.idea=t;state.phase='questions';}
    else if(state.phase==='questions'){
      if(state.answers.length<questions.length)state.answers.push(t);
      if(state.answers.length===2 && !state.tone){state.phase='tone';}
      else if(state.answers.length>=questions.length){state.phase='offer';}
    }else if(state.phase==='more'||state.phase==='plan'){
      state.extra.push(t);state.phase='more';state.plan=false;
    }
    persist();render();
  }
  function getPlanText(){
    const rows=[['아이디어 개요',state.idea],...fields.map((x,i)=>[x,state.answers[i]||'추가 정의 필요'])];
    if(state.extra.length)rows.push(['추가로 발전시킨 내용',state.extra.join('\n')]);
    rows.push(['다음 단계','핵심 기능을 시험하고, 실제 사용자 반응과 기술적 조건을 확인한다.']);
    return '# '+state.idea.slice(0,55)+'\n\n아이디어 사업계획서 · 탐색 단계 초안\n\n'+rows.map(([h,t])=>'## '+h+'\n'+t).join('\n\n')+'\n\n※ 검증되지 않은 사용자 구상에 기반한 초안입니다.\n';
  }
  function downloadPlan(){
    const file=new Blob([getPlanText()],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='moru_아이디어_기획서.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  function resize(){input.style.height='auto';input.style.height=Math.min(145,input.scrollHeight)+'px';}
  $('send').addEventListener('click',submit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});
  input.addEventListener('input',resize);
  $('reset').addEventListener('click',()=>{if(!confirm('지금까지의 데모 기록을 처음부터 다시 시작할까요?'))return;state=initial();persist();render();});
  render();
})();
</script></body></html>
