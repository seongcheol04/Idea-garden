<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#060e19" />
    <meta
      name="description"
      content="막연한 생각에서 나만의 북극성을 발견하는, Moru 생각의 바다. 브라우저에서 작동하는 독립 프로토타입."
    />
    <title>Moru — 생각의 바다</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e4e8e6;
        --muted: #99aab4;
        --dim: #728997;
        --gold: #d8bf89;
        --line: #c3d8e21c;
        --panel: #0c1925;
        --teal: #a4c6c4;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050c15;
        color: var(--ink);
        min-height: 100svh;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      button,
      summary {
        touch-action: manipulation;
      }
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 5px;
      }
      ::selection {
        background: #a3bdb544;
        color: white;
      }
      [hidden] {
        display: none !important;
      }
      button svg {
        pointer-events: none;
      }
      .sky {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
      }
      #world {
        position: fixed;
        inset: 0;
        isolation: isolate;
        overflow: hidden;
      }
      #world:after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 42%,
          transparent 30%,
          #01050d65 100%
        );
        z-index: 1;
      }
      .top {
        position: fixed;
        z-index: 5;
        left: 5.3%;
        right: 5.3%;
        top: max(30px, env(safe-area-inset-top));
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        border: 0;
        background: none;
        padding: 3px;
        color: #e8e8dc;
        text-align: left;
        font-family: Georgia, serif;
        font-size: 43px;
        font-weight: 600;
        letter-spacing: -3px;
        line-height: 1;
      }
      .brand i {
        color: #9db7b6;
        font-style: normal;
      }
      .brand small {
        font-family: inherit;
        font-size: 9px;
        letter-spacing: 3px;
        display: block;
        font-weight: 400;
        color: #8b9fa9;
        margin-top: 13px;
        margin-left: 2px;
      }
      .header-actions {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: #a9b9bf;
        padding: 12px 4px;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .text-btn:hover {
        color: var(--gold);
      }
      .round {
        border: 1px solid #b4c6d025;
        background: #12223065;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
      }
      .round:hover {
        background: #21364685;
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .intro {
        position: absolute;
        z-index: 2;
        left: 11.5%;
        top: 25%;
        pointer-events: none;
        transition: opacity 1.5s;
      }
      .intro .overline {
        color: #99b3c0;
        font: 10px/1.6 monospace;
        letter-spacing: 4px;
        margin-bottom: 27px;
      }
      .intro h1 {
        font-size: clamp(30px, 3.5vw, 49px);
        font-weight: 350;
        letter-spacing: -2px;
        line-height: 1.6;
        margin: 0;
        color: #d3dedd;
      }
      .intro h1 em {
        font-family: Georgia, "Apple SD Gothic Neo", serif;
        font-weight: 300;
        font-style: normal;
        color: #a6bbc4;
      }
      .intro p {
        font-size: 13px;
        line-height: 1.9;
        color: #9bacb4;
        margin-top: 26px;
        letter-spacing: 0.04em;
      }
      .voyage-title {
        position: fixed;
        left: 5.5%;
        bottom: 88px;
        z-index: 3;
        max-width: min(420px, 70vw);
        pointer-events: none;
      }
      .voyage-title small {
        display: block;
        font: 9px monospace;
        letter-spacing: 3px;
        color: #91a6af;
        margin-bottom: 14px;
      }
      .voyage-title p {
        font-size: 17px;
        font-weight: 350;
        line-height: 1.8;
        white-space: pre-line;
        margin: 0;
        color: #c6d4d6;
      }
      .scene-object {
        position: absolute;
        z-index: 3;
        border: 0;
        background: none;
        padding: 0;
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        transform: translate(-50%, -50%);
        color: #a8b9be;
      }
      .boat {
        left: 51%;
        top: 65%;
        width: 132px;
        min-height: 140px;
        transition:
          left 9s ease-in-out,
          top 9s ease-in-out;
      }
      .boat svg {
        width: 115px;
        height: 120px;
        overflow: visible;
        filter: drop-shadow(0 8px 18px #ddc08b12);
        animation: bob 8s ease-in-out infinite;
        transform-origin: 50% 80%;
      }
      .boat:hover svg,
      .boat:focus-visible svg {
        filter: drop-shadow(0 0 14px #e4cc9d35);
      }
      .object-label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.12em;
        margin-top: 4px;
        color: #94abb5;
        transition: color 0.3s;
      }
      .boat .object-label {
        opacity: 0;
        transition: opacity 0.4s;
      }
      .boat:hover .object-label,
      .boat:focus-visible .object-label {
        opacity: 1;
      }
      .voyaging .boat {
        left: 61%;
        top: 61%;
      }
      .crew-tag {
        font-size: 9px;
        border: 1px solid #c4d9d126;
        border-radius: 20px;
        padding: 5px 9px;
        background: #10212bc7;
        color: #b1c9c5;
      }
      .north {
        left: 72%;
        top: 20%;
        width: 90px;
        height: 85px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 2s;
      }
      .north.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .north-mark {
        width: 9px;
        height: 9px;
        background: #fff5ce;
        transform: rotate(45deg);
        box-shadow:
          0 0 15px 5px #e0c48b55,
          0 0 65px 23px #a0c6d61c;
      }
      .north-mark:before,
      .north-mark:after {
        content: "";
        position: absolute;
        background: linear-gradient(transparent, #fff2b6, transparent);
        left: 4px;
        top: -15px;
        width: 1px;
        height: 39px;
        transform: rotate(-45deg);
      }
      .north-mark:after {
        transform: rotate(45deg);
      }
      .north .object-label {
        margin-top: 27px;
        color: #c9cbb1;
        font-size: 10px;
      }
      .lighthouse {
        left: 22%;
        top: 52%;
        width: 120px;
        min-height: 150px;
      }
      .lighthouse svg {
        width: 100px;
        height: 122px;
        overflow: visible;
      }
      .lighthouse .object-label {
        color: #bac7bd;
      }
      .city {
        left: 85%;
        top: 48%;
        width: 145px;
        min-height: 110px;
      }
      .city svg {
        width: 130px;
        height: 90px;
      }
      .city .object-label {
        color: #a9b6b4;
      }
      .beam {
        animation: beam 12s ease-in-out infinite;
        transform-origin: 55px 29px;
      }
      .foot {
        position: fixed;
        z-index: 3;
        left: 5.5%;
        right: 5.5%;
        bottom: max(30px, calc(env(safe-area-inset-bottom) + 18px));
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #7b929f;
        font-size: 10px;
        letter-spacing: 0.07em;
        gap: 20px;
      }
      .foot .start {
        border: 0;
        background: none;
        color: #aebdc3;
        letter-spacing: 0.08em;
        font-size: 11px;
        padding: 15px;
        display: flex;
        gap: 13px;
        align-items: center;
        margin: auto;
      }
      .start:before,
      .start:after {
        content: "";
        display: inline-block;
        width: 37px;
        height: 1px;
        background: #a0b6c338;
      }
      .foot .subfoot {
        font: 9px monospace;
        letter-spacing: 2px;
      }
      .save-indicator {
        font-size: 10px;
        color: #8daea8;
      }
      .storage-warning {
        position: fixed;
        z-index: 9;
        top: 100px;
        right: 5%;
        max-width: 350px;
        padding: 14px 18px;
        border: 1px solid #c2a07c55;
        border-radius: 14px;
        color: #eed8bc;
        background: #202329f2;
        font-size: 12px;
        line-height: 1.8;
      }
      .discovery {
        position: fixed;
        z-index: 6;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background:
          radial-gradient(ellipse at 67% 25%, #b5d1d90e, transparent 65%),
          #030b145c;
        animation: reveal 2s ease;
      }
      .discovery > div {
        max-width: 620px;
        padding: 30px;
      }
      .discovery .tiny-label {
        color: #d1bb8d;
        letter-spacing: 4px;
      }
      .discovery h2 {
        font-weight: 350;
        font-size: clamp(28px, 4vw, 44px);
        letter-spacing: -1.5px;
        line-height: 1.5;
        margin: 23px 0;
      }
      .discovery p {
        font-size: 15px;
        line-height: 2;
        color: #b4c9d0;
        white-space: pre-line;
      }
      .discovery button {
        margin-top: 22px;
      }
      .spark-wave {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 72% 20%,
          #eddbab35,
          transparent 1%
        );
        animation: star-wave 4s ease-out forwards;
        z-index: -1;
      }
      .skip {
        position: fixed;
        left: 10px;
        top: -100px;
        z-index: 20;
        background: var(--panel);
        padding: 15px;
        color: var(--ink);
      }
      .skip:focus {
        top: 10px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      /* The floating logbook only appears when the sailor asks for it. */
      dialog {
        color: var(--ink);
        border: 1px solid #9dbac22b;
        border-radius: 24px;
        background: linear-gradient(145deg, #12222efc, #091724fc);
        box-shadow: 0 26px 120px #0007;
        padding: 0;
        width: min(460px, calc(100vw - 40px));
        max-height: calc(100dvh - 100px);
        position: fixed;
        inset: auto 34px 34px auto;
        margin: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-color: #536b76 #0a1822;
      }
      dialog::backdrop {
        background: #02091252;
        backdrop-filter: blur(2px);
      }
      .sheet-head {
        padding: 25px 27px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
      }
      .sheet-head .kicker,
      .tiny-label {
        font-size: 9px;
        letter-spacing: 2px;
        color: #a6bbb9;
        font-family: monospace;
      }
      .sheet-body {
        padding: 17px 27px 28px;
      }
      .sheet-body h2 {
        font-size: 25px;
        line-height: 1.65;
        font-weight: 430;
        letter-spacing: -1px;
        margin: 7px 0 13px;
        white-space: pre-line;
      }
      .sub {
        font-size: 12px;
        line-height: 1.9;
        color: var(--muted);
        margin: 10px 0 20px;
      }
      .sheet-body p {
        overflow-wrap: anywhere;
      }
      .sheet-body label.field-label {
        display: block;
        font-size: 11px;
        color: #b0c2c7;
        margin: 20px 0 10px;
      }
      .answer {
        display: block;
        width: 100%;
        background: #05121b80;
        border: 1px solid #879fad40;
        border-radius: 13px;
        padding: 17px 16px;
        min-height: 145px;
        resize: vertical;
        font-size: 16px;
        line-height: 1.85;
        color: #e0e8e6;
        outline-offset: 3px;
        transition: border-color 0.2s;
      }
      .answer::placeholder {
        color: #6f8a98;
      }
      .answer:focus {
        border-color: #b3c7c18c;
      }
      .answer.small {
        min-height: 100px;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid #91aaa54d;
        border-radius: 50px;
        background: #b5c9bf;
        color: #10252b;
        min-height: 45px;
        padding: 12px 21px;
        font-size: 12px;
        font-weight: 650;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }
      .btn:hover {
        background: #d0dbcb;
      }
      .btn.ghost {
        background: transparent;
        color: #b3c6cb;
        border-color: #92a8b137;
      }
      .btn.gold {
        background: #d2bc8c;
        border-color: #e9d1a1;
        color: #24271e;
      }
      .btn.danger {
        background: #5b393f44;
        color: #e2bcb8;
        border-color: #c59c9a40;
      }
      .link {
        background: none;
        border: 0;
        color: #9cb8bf;
        text-decoration: underline;
        text-underline-offset: 4px;
        font-size: 11px;
        padding: 12px 0;
      }
      .error {
        color: #ebbaad;
        font-size: 12px;
        line-height: 1.8;
        min-height: 0;
      }
      .error:not(:empty) {
        margin-top: 12px;
      }
      .step-count {
        font: 9px monospace;
        color: #96b3c0;
        letter-spacing: 2px;
      }
      .context {
        border-left: 1px solid #a6c7c151;
        padding-left: 14px;
        margin: 20px 0;
        color: #b0c3c6;
        font-size: 12px;
        line-height: 1.85;
        white-space: pre-line;
      }
      .check-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        line-height: 1.8;
        color: #b6c7cc;
        margin: 15px 0;
        cursor: pointer;
      }
      .check-row input {
        accent-color: #c9c89d;
        margin-top: 4px;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .goal-summary {
        display: grid;
        grid-template-columns: 45px 1fr;
        gap: 13px 12px;
        margin: 22px 0;
        font-size: 12px;
        line-height: 1.8;
      }
      .goal-summary dt {
        color: #7997a6;
      }
      .goal-summary dd {
        margin: 0;
        color: #c0d0d0;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .waypoints {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 12px -4px 22px;
        padding: 4px;
        scrollbar-width: thin;
      }
      .waypoint {
        flex-shrink: 0;
        border: 1px solid #91adba30;
        background: none;
        padding: 9px 12px;
        border-radius: 30px;
        color: #8fa7b4;
        min-height: 40px;
        font-size: 11px;
      }
      .waypoint.active {
        background: #c1d0c01a;
        color: #d4e1da;
        border-color: #a9c3bd7a;
      }
      .waypoint.done:before {
        content: "· ";
        color: #d0ba85;
      }
      .plan-progress {
        height: 2px;
        background: #a9c0cd20;
        margin: 20px 0;
      }
      .plan-progress > span {
        height: 100%;
        display: block;
        background: #b3c5b5;
        transition: width 0.7s;
      }
      .paper-section {
        padding: 20px 0;
        border-top: 1px solid var(--line);
      }
      .paper-section h3 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 9px;
      }
      .paper-section p {
        font-size: 13px;
        line-height: 1.9;
        color: #b3c9cd;
        white-space: pre-line;
        margin: 0;
      }
      .paper-section .link {
        font-size: 10px;
      }
      .demo-notice {
        border: 1px solid #bbac7642;
        background: #e4cf9b0a;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 11px;
        color: #ccbea0;
        line-height: 1.8;
        margin: 7px 0 20px;
      }
      .city-tabs {
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
      .city-tabs button {
        flex: 1;
        line-height: 1.7;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #c7d7db26;
        background: transparent;
        font-size: 11px;
        color: #a3bbc2;
      }
      .city-tabs button.active {
        border-color: #d4bc8177;
        color: #e1d2ae;
        background: #e8cc8310;
      }
      .person {
        padding: 17px 0;
        border-top: 1px solid var(--line);
      }
      .person h3 {
        font-size: 13px;
        font-weight: 500;
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0;
      }
      .avatar {
        height: 29px;
        width: 29px;
        background: #9cbdaf20;
        color: #bbd1c6;
        border: 1px solid #c2d2c223;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .person h3 small {
        font-size: 9px;
        color: #91a6b0;
        font-weight: 400;
      }
      .person p {
        font-size: 13px;
        line-height: 1.9;
        color: #b8cbd0;
        margin: 11px 0 0;
      }
      .status {
        font-size: 10px;
        color: #c6b88f;
        display: block;
        margin-top: 11px;
      }
      .person .actions {
        margin-top: 9px;
      }
      .log-item {
        border-top: 1px solid var(--line);
        padding: 15px 0;
      }
      .log-open {
        border: 0;
        background: none;
        text-align: left;
        padding: 9px 0;
        width: 100%;
        color: #c2d4d5;
        font-size: 14px;
        line-height: 1.8;
      }
      .log-open small {
        display: block;
        font-size: 10px;
        color: #86a2ae;
        margin-top: 6px;
      }
      .empty {
        padding: 25px 0;
        color: #b6cad0;
        font-size: 14px;
        line-height: 2;
      }
      .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        border-top: 1px solid var(--line);
        gap: 18px;
        font-size: 13px;
      }
      .settings-row input {
        accent-color: var(--gold);
        width: 18px;
        height: 18px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: max(35px, calc(env(safe-area-inset-bottom) + 24px));
        transform: translate(-50%, 12px);
        width: max-content;
        max-width: calc(100vw - 38px);
        padding: 13px 22px;
        border: 1px solid #a9bec137;
        border-radius: 16px;
        background: #10232ef5;
        box-shadow: 0 10px 40px #0005;
        color: #c9d9d8;
        font-size: 12px;
        line-height: 1.8;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .save-status {
        font-size: 10px;
        color: #8daaa8;
        margin-top: 14px;
      }
      .save-status.failed {
        color: #e2b4a5;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 24px 0;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-1.7deg);
        }
        50% {
          transform: translateY(5px) rotate(1.8deg);
        }
      }
      @keyframes beam {
        0%,
        100% {
          opacity: 0.13;
          transform: rotate(-6deg);
        }
        50% {
          opacity: 0.55;
          transform: rotate(8deg);
        }
      }
      @keyframes reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes star-wave {
        0% {
          opacity: 0;
          background-size: 100% 100%;
          transform: scale(0.5);
        }
        30% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;

        function backup() {

            blocked
              ? "보관된 원문을 복구용으로 내려받았어요."

            const incoming = validateState(JSON.parse(await file.text()));
            const existing = new Set(state.voyages.map((v) => v.id)),

        function syncWorld() {

        document.addEventListener("click", (e) => {

        document.addEventListener("keydown", (e) => {

        document.addEventListener("input", (e) => {

        window.addEventListener("storage", (e) => {

        // Cinematic scene: a capped pixel ratio and 24fps canvas; no assets, requests, or audio.
        const canvas = $("ocean"),
          ctx = canvas.getContext("2d"),
          motionQuery = matchMedia("(prefers-reduced-motion: reduce)");
        let width = innerWidth,
          height = innerHeight,
          stars = [],
          raf = 0,
          lastFrame = 0,
          northBloom = -1,
          pointer = { x: 0, y: 0 },
          ripple = null;
        function isStill() {
          return motionQuery.matches || state.settings.still;
        }
        let seed = 7197;
        function random() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }
        function resize() {
          width = innerWidth;
          height = innerHeight;
          const ratio = Math.min(devicePixelRatio || 1, 1.7);
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx?.setTransform(ratio, 0, 0, ratio, 0, 0);
          seed = 7197;
          stars = Array.from({ length: width < 650 ? 125 : 260 }, () => ({
            x: random() * width,
            y: random() * height * 0.49,
            r: 0.35 + random() * 1.05,
            phase: random() * Math.PI * 2,
            light: 0.12 + random() * 0.65,
          }));
          renderOnce();
        }
        function draw(now) {
          if (!ctx) return;
          const t = isStill() ? 0 : now * 0.00012;
          const sky = ctx.createLinearGradient(0, 0, 0, height);
          sky.addColorStop(0, "#030a14");
          sky.addColorStop(0.35, "#0a1929");
          sky.addColorStop(0.49, "#182f3c");
          sky.addColorStop(0.505, "#102734");
          sky.addColorStop(0.63, "#091b29");
          sky.addColorStop(1, "#030d18");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          const haze = ctx.createRadialGradient(
            width * 0.63,
            height * 0.46,
            2,
            width * 0.63,
            height * 0.46,
            width * 0.55,
          );
          haze.addColorStop(0, "#8eaaa91e");
          haze.addColorStop(0.4, "#5c8c9a0a");
          haze.addColorStop(1, "#1a415300");
          ctx.fillStyle = haze;
          ctx.fillRect(0, 0, width, height * 0.58);
          const nebula = ctx.createRadialGradient(
            width * 0.72,
            height * 0.2,
            2,
            width * 0.72,
            height * 0.2,
            width * 0.36,
          );
          nebula.addColorStop(0, "#5361780d");

              {
                app: "moru-previous-records",
                version: 1,
                sources,
                exportedAt: new Date().toISOString(),
              },
              null,
              2,
            ),
            url = URL.createObjectURL(
              new Blob([data], { type: "application/json" }),
            ),
            a = document.createElement("a");
          a.href = url;
          a.download = "moru-previous-records.json";
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 3000);
          toast("이전 데이터의 원문을 백업했어요. 원본은 변경하지 않았어요.");
        }

        resize();
        syncWorld();
        startAnimation();
      })();
    </script>
  </body>
</html>
