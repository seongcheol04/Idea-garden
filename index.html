<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>moru — 생각이 자라는 곳</title><meta name="theme-color" content="#FAF9F5"><style>
:root{--bg:#FAF9F5;--ink:#33493E;--muted:#84958A;--line:#E4EBE3;--green:#81A68D}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(48px);pointer-events:none}body:before{background:#E1F0E4;width:350px;height:350px;top:-160px;right:-140px}body:after{background:#EFE7F3;width:280px;height:280px;left:-160px;bottom:-100px}button,textarea,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}.app{max-width:680px;padding:0 23px;min-height:100dvh;margin:auto;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;height:86px}.brand{font-size:23px;letter-spacing:-1.5px;font-weight:740;display:flex;align-items:center;gap:10px}.brand i{font-style:normal;background:#E4F0E4;border-radius:15px;padding:8px}.ghost{border:1px solid var(--line);background:#ffffffba;border-radius:30px;color:var(--muted);padding:10px 14px;font-size:12px}.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 50px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:#8DA793;font-weight:700;margin:0 0 20px}.question{font-size:clamp(26px,5vw,36px);font-weight:640;line-height:1.52;letter-spacing:-1.3px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.sub{margin:17px 0 0;color:var(--muted);font-size:14px;line-height:1.8;overflow-wrap:anywhere}.composer{background:#fffefa;border:1px solid var(--line);display:flex;align-items:flex-end;gap:10px;border-radius:24px;padding:13px 14px 13px 19px;margin-top:30px;box-shadow:0 18px 42px #44664A0C}.composer textarea{flex:1;border:none;outline:none;background:transparent;resize:none;font-size:16px;line-height:1.8;color:var(--ink);min-height:48px;max-height:190px}.composer textarea::placeholder{color:#B0BCB1}.send{border:0;background:var(--green);color:white;width:45px;height:45px;flex:none;border-radius:17px;font-size:23px}.options{display:grid;gap:10px;margin-top:28px}.option{text-align:left;border:1px solid var(--line);background:#fffefa;padding:17px 19px;border-radius:20px;color:var(--ink)}.option strong{display:block;font-size:15px;margin-bottom:5px}.option small{color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:27px}.primary{background:var(--green);border:none;color:white;padding:14px 22px;border-radius:30px}.secondary{background:#fffefa;border:1px solid var(--line);color:#688A75;padding:14px 20px;border-radius:30px}.note{background:#EDF4ED;border-radius:17px;padding:15px 17px;margin-top:22px;font-size:13px;line-height:1.7;color:#607E69}.status{font-size:12px;color:var(--muted);margin-top:15px;min-height:17px}.draft{background:#fffefa;border:1px solid var(--line);border-radius:24px;padding:26px;margin-top:24px;max-height:50vh;overflow-y:auto}.draft h2{font-size:21px;margin:0 0 20px;line-height:1.5}.draft section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.draft h3{font-size:13px;color:#769882}.draft p{line-height:1.8;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.footer{padding:14px 0 28px;color:#ADB9AE;text-align:center;font-size:11px}.settings{font-size:12px;color:var(--muted);line-height:1.8;margin-top:15px}.settings input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink);margin-top:7px}.hidden{display:none!important}@media(max-width:500px){.top{height:75px}.main{justify-content:flex-start;padding-top:9vh}.question{font-size:29px}.draft{max-height:52vh}}
</style></head><body><div class="app"><header class="top"><div class="brand"><i>🌱</i>moru</div><button class="ghost" id="restart">새로운 생각</button></header><main class="main"><div id="screen"></div><div id="status" class="status" role="status"></div></main><footer class="footer">아이디어에만 집중해요 · 원본과 답변은 이 브라우저에 저장됩니다</footer></div><script>
(()=>{'use strict';const KEY='moru-ai-v5', $=x=>document.getElementById(x);let s={idea:'',history:[],tone:null,phase:'start',ready:false,plan:null,endpoint:''};try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&typeof old.idea==='string'&&Array.isArray(old.history))s={...s,...old}}catch{};let busy=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const el=(tag,cls,txt,parent)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;(parent||$('screen')).append(n);return n};const button=(label,fn,cls='primary',parent)=>{const b=el('button',cls,label,parent);b.type='button';b.onclick=fn;return b};const status=t=>$('status').textContent=t;function input(placeholder,callback){const f=el('form','composer');const t=el('textarea','',undefined,f);t.rows=2;t.placeholder=placeholder;t.maxLength=2000;t.setAttribute('aria-label','내용 입력');const b=el('button','send','↑',f);b.type='submit';f.onsubmit=async e=>{e.preventDefault();if(busy)return;const v=t.value.trim();if(!v)return;b.disabled=true;const ok=await callback(v);if(!ok)b.disabled=false};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();f.requestSubmit()}};return t}function endpoint(){let v=(s.endpoint||'').trim().replace(/\/+$/,'');return v||location.origin}async function api(mode,history){const r=await fetch(endpoint()+'/api/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:s.idea,history:history||s.history,tone:s.tone||'warm',mode})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'서버 응답 오류');return j}function render(){const root=$('screen');root.replaceChildren();status('');if(s.phase==='start'){el('p','eyebrow','A LITTLE IDEA');el('h1','question','문득 떠오른 생각,\n여기서 키워볼까?');el('p','sub','완벽하게 설명할 필요 없어. 생각나는 대로 적어줘.');input('어떤 생각이 떠올랐어?',async v=>{s.idea=v;s.history=[];s.tone=null;s.plan=null;s.phase='tone';save();render();return true});const settings=el('details','settings');el('summary','','AI 서버 연결 설정',settings);el('p','','GitHub Pages라면 배포한 API 서버 주소를 입력해 줘. API 키는 여기 입력하지 않아.',settings);const field=el('input','',undefined,settings);field.placeholder='https://내-서버.onrender.com';field.value=s.endpoint;field.onchange=()=>{s.endpoint=field.value.trim();save()};return}
if(s.phase==='tone'){el('p','eyebrow','YOUR IDEA PARTNER');el('h1','question','어떤 말투로\n함께 생각해 볼까?');el('p','sub','중간에 바꿔도 돼. 아이디어를 발전시키는 방식은 같아.');const opts=el('div','options');[['warm','☁️ 다정한 동반자','따뜻하지만 과장 없는 말투'],['playful','🍋 장난기 있는 비평가','가벼운 농담과 건설적인 반론'],['clear','🌿 차분한 설계자','명료하고 군더더기 없는 말투']].forEach(([v,label,desc])=>{const b=el('button','option',undefined,opts);el('strong','',label,b);el('small','',desc,b);b.onclick=async()=>{s.tone=v;s.phase='thinking';save();render();await nextTurn()}});return}
if(s.phase==='thinking'){el('p','eyebrow','IDEA IN PROGRESS');el('h1','question','생각을 살펴보고 있어…');el('p','sub','지금 가장 도움이 될 질문을 고르는 중이야.');return}
if(s.phase==='talk'){el('p','eyebrow','GROWING YOUR IDEA');const last=[...s.history].reverse().find(x=>x.role==='assistant');el('h1','question',last?last.content:'아이디어를 조금 더 들려줄래?');if(s.history.length>1){const latest=[...s.history].reverse().find(x=>x.role==='user');if(latest)el('p','sub','지난 답변 · '+latest.content.slice(0,110)+(latest.content.length>110?'…':''))}input('편하게 답해 줘...',async v=>{if(busy)return false;busy=true;const snapshot=s.history.slice();s.history.push({role:'user',content:v});s.phase='thinking';save();render();try{const response=await api('next');s.history.push({role:'assistant',content:response.reply});s.ready=Boolean(response.ready);s.phase='talk';save();render();return true}catch(e){s.history=snapshot;s.phase='talk';save();render();status('연결 실패: '+e.message+' · 답변을 다시 입력해 줘.');return false}finally{busy=false}});const buttons=el('div','actions');if(s.ready)button('사업계획서로 정리해 볼까? ↗',()=>{s.phase='offer';save();render()},'secondary',buttons);button('말투 바꾸기',()=>{s.phase='tone';save();render()},'secondary',buttons);return}
if(s.phase==='offer'){el('p','eyebrow','YOUR IDEA IS GROWING');el('h1','question','이제 이 생각을\n하나의 기획으로 묶어볼까?');el('p','sub','아직 확인되지 않은 부분은 미검증으로 표시해서 사업계획서 초안을 만들어 줄게.');const a=el('div','actions');button('사업계획서 만들기 ↗',generate,'primary',a);button('더 구체화할래',()=>{s.phase='talk';save();render()},'secondary',a);return}
if(s.phase==='plan'){el('p','eyebrow','YOUR IDEA BLUEPRINT');el('h1','question','이제 생각이\n하나의 설계가 됐어.');el('p','sub','이 문서는 아직 검증이 필요한 사업계획서 초안이야.');const paper=el('article','draft');el('h2','',s.plan.title||'아이디어 설계서',paper);(s.plan.sections||[]).forEach(a=>{const section=el('section','',undefined,paper);el('h3','',a.heading,section);el('p','',a.body,section)});if(s.plan.caveats?.length){const sec=el('section','',undefined,paper);el('h3','','주의 및 미검증 항목',sec);el('p','',s.plan.caveats.join('\n• '),sec)}const a=el('div','actions');button('문서 저장 ↓',download,'primary',a);button('아이디어 더 발전시키기',()=>{s.phase='talk';save();render()},'secondary',a);return}}
async function nextTurn(){busy=true;try{const result=await api('next');s.history.push({role:'assistant',content:result.reply});s.ready=Boolean(result.ready);s.phase='talk';save();render()}catch(e){s.phase='tone';save();render();status('AI 연결 실패: '+e.message+' · 서버 주소와 설정을 확인해 줘.')}finally{busy=false}}
async function generate(){if(busy)return;busy=true;s.phase='thinking';save();render();try{s.plan=await api('plan');s.phase='plan';save();render()}catch(e){s.phase='offer';save();render();status('사업계획서를 생성하지 못했어: '+e.message)}finally{busy=false}}
function download(){if(!s.plan)return;const text='# '+s.plan.title+'\n\n'+(s.plan.sections||[]).map(x=>'## '+x.heading+'\n\n'+x.body).join('\n\n')+'\n\n## 미검증 항목\n\n'+(s.plan.caveats||[]).join('\n');const blob=new Blob(['\ufeff'+text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='moru_사업계획서_초안.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('restart').onclick=()=>{if(!confirm('현재 아이디어와 대화 기록을 지우고 새로 시작할까?'))return;const endpoint=s.endpoint;s={idea:'',history:[],tone:null,phase:'start',ready:false,plan:null,endpoint};save();render()};if(s.phase==='thinking')s.phase=s.history.some(x=>x.role==='assistant')?'talk':'tone';render();})();
</script></body></html>
