<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f9f5" />
    <meta
      name="description"
      content="생각을 기록하고, 연결하고, 작은 실험으로 현실에 옮기는 아이디어 정원 Moru"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>moru. — 생각의 정원 v11.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <button class="logo" id="brand" aria-label="Moru 홈">
          moru<span>.</span>
        </button>
        <nav id="nav" class="nav" aria-label="주요 탐색"></nav>
        <button data-action="settings" class="top-settings" aria-label="설정">
          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.2 2.2m9.8 9.8 2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"
            />
          </svg>
        </button>
      </header>
      <a class="skip-link" href="#app">본문으로 건너뛰기</a>
      <main tabindex="-1" id="app" class="view"></main>
      <footer class="footer-note">
        moru. — 생각은 생각과 만나 자라나니까.
      </footer>
    </div>
    <div id="overlay" class="overlay" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input
      id="import-file"
      type="file"
      accept=".json,application/json"
      hidden
      aria-label="Moru 백업 불러오기"
    />
    <script src="./app.js" defer></script>
  </body>
</html>
