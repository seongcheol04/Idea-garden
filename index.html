.library-top{display:flex;justify-content:space-between;align-items:end;gap:22px;margin:46px 0 29px}.library-top h1{margin:10px 0 7px;font-size:clamp(33px,6vw,44px);letter-spacing:-2px}.library-top p{margin:0;color:var(--muted);font-size:13px}.library-top .btn{margin-bottom:4px}.searchbar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 14px;height:50px;max-width:440px}.searchbar svg{width:17px;height:17px;color:#9eac9d}.searchbar input{border:0;background:transparent;outline:none!important;font-size:13px;width:100%;color:var(--ink)}.searchbar input::placeholder{color:#a7b1a5}.filters{display:flex;gap:7px;margin:18px 0 23px;flex-wrap:wrap}.filter{border:1px solid #e6e9e0;background:transparent;border-radius:50px;color:#7c8a7d;font-size:12px;font-weight:650;padding:9px 13px}.filter.active{background:#365c44;color:#fff;border-color:#365c44}.garden-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.seed-card{min-height:216px;text-align:left;background:#fffefa;border:1px solid #e4e9df;border-radius:23px;padding:21px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .22s,border .22s,box-shadow .22s;box-shadow:0 8px 28px rgba(42,64,48,.025)}.seed-card:hover{transform:translateY(-4px);border-color:#bfceb8;box-shadow:0 14px 30px rgba(42,64,48,.065)}.seed-card:active{transform:scale(.987)}.seed-card.tone-1{background:#fcf8f2}.seed-card.tone-2{background:#f7f8f5}.seed-card.tone-3{background:#faf8fc}.seed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#8a9a8b;font-size:11px;margin-bottom:24px}.seed-head .pin{color:#e4a66f}.seed-content{max-width:82%;font-size:18px;letter-spacing:-.6px;font-weight:670;line-height:1.55;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 auto}.seed-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:#8a9b8b;margin-top:25px}.seed-art{position:absolute;right:-23px;bottom:-36px;width:150px;height:148px;opacity:.5;transform:rotate(8deg);pointer-events:none}.seed-card:hover .seed-art{animation:sway 2.6s ease-in-out infinite}.empty-state{padding:75px 20px;text-align:center;border:1px dashed #d9e1d4;border-radius:24px;color:#829484;line-height:1.8}.empty-state strong{display:block;margin-top:10px;color:#3d5d45;font-size:16px}.empty-state p{font-size:13px}.library-footer{border-top:1px solid var(--line);padding-top:24px;margin-top:43px;display:flex;gap:15px;flex-wrap:wrap}.library-footer button{border:0;background:none;color:#829184;font-size:12px;padding:7px 0}

color:#84729f}.choice.link .choice-icon{background:#f1e8e7;color:#ae8078}.choice strong{font-size:14px;font-weight:780;display:block;margin:1px 0 5px;letter-spacing:-.2px}.choice span.caption{display:block;color:#829184;font-size:11px;line-height:1.6}.choice-footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 26px}.choice-footer .textbtn{font-size:12px}
.side-plant{background:#edf2e9;border:1px solid #e0e9dc;border-radius:24px;position:sticky;top:26px;padding:20px 21px 19px;overflow:hidden}.side-plant h3{font-size:13px;font-weight:780;margin:0 0 3px}.side-plant p{font-size:11px;color:#7d9280;margin:6px 0 0;line-height:1.6}.side-plant .plant-stage{height:202px;display:grid;place-items:center;position:relative}.side-plant .plant-stage::after{content:'';position:absolute;bottom:16px;left:18%;right:18%;height:1px;background:#cbddc4}.plant-svg{width:100%;height:100%;overflow:visible;max-height:235px}.plant-svg .stem{stroke:#548963;stroke-width:6;stroke-linecap:round;fill:none;stroke-dasharray:240;stroke-dashoffset:0;animation:drawstem 1.1s ease both}.plant-svg .leaf{fill:#8cac83;transform-origin:center;animation:leafin .75s cubic-bezier(.15,1.5,.35,1) both}.plant-svg .leaf.l2{fill:#a6bf93;animation-delay:.15s}.plant-svg .leaf.l3{fill:#719b75;animation-delay:.3s}.plant-svg .leaf.l4{fill:#bbcd9c;animation-delay:.4s}.plant-svg .flower{fill:#e9b697;animation:pop .65s .35s both;transform-origin:center}.plant-svg .flower-mid{fill:#e5c979}.plant-svg .soil{fill:#d2dccc}.plant-svg .seed{fill:#708a65}.plant-svg .spark{fill:#edc99e;opacity:.7}@keyframes drawstem{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}@keyframes leafin{from{opacity:0;transform:scale(.12)}to{opacity:1;transform:scale(1)}}@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bloom{from{transform:scale(.2) rotate(-23deg)}to{transform:scale(1) rotate(0deg)}}@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}.side-plant .plant-count{margin-top:7px;padding:13px 0 0;border-top:1px solid #dce7d7;display:flex;justify-content:space-between;font-size:12px;color:#739077}.side-plant .plant-count strong{color:var(--green);font-variant-numeric:tabular-nums}

.compose{border-radius:22px;border:1px solid #cbdac7;background:#f4f8f0;margin:19px 0 25px;padding:23px;animation:rise .33s ease}.compose-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.compose-top .mode-label{font-size:12px;color:#51795a;font-weight:760}.compose-top .xbtn{width:30px;height:30px;display:grid;place-items:center;border:0;background:#e9f0e6;border-radius:50%;color:#79917a}.compose-top .xbtn svg{width:15px;height:15px}.compose h3{font-size:21px;letter-spacing:-.7px;margin:15px 0 9px;line-height:1.55}.compose .sub{font-size:12px;color:#849787;line-height:1.7;margin:0 0 13px}.compose .prompt-row{display:flex;gap:14px;align-items:center;margin:11px 0 15px}.compose .prompt-row button{background:none;border:0;padding:6px 0;color:#64816a;font-size:12px;font-weight:700}.compose textarea{width:100%;border:1px solid #e0e8d9;outline:0;border-radius:16px;min-height:128px;background:#fffefa;padding:16px;font-size:15px;color:var(--ink);line-height:1.85;resize:vertical}.compose textarea:focus{border-color:#92af8e}.compose textarea::placeholder{color:#abb7a9}.compose-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:15px}.compose-actions small{font-size:11px;color:#98a795}.compose-actions .btn{min-width:128px}.link-select{width:100%;border-radius:14px;border:1px solid #dbe7d7;background:#fff;max-height:220px;overflow-y:auto;margin:12px 0}.link-pick{width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid #edf0e9;background:#fff;color:#3d5542;font-size:12px;line-height:1.6}.link-pick:hover,.link-pick.active{background:#eaf3e6}.link-pick:last-child{border-bottom:0}.selected-link{font-size:12px;color:#476d4c;padding:8px 2px}.composer-note{background:#e9f0e7;border-radius:14px;padding:13px;font-size:12px;color:#5f7964;line-height:1.65}

.timeline{border-left:2px solid #e0eadb;margin:17px 0 0 12px;padding:0 0 8px 25px}.branch-entry{position:relative;margin-bottom:22px;background:#fffefa;border-radius:17px;border:1px solid #e8ede2;padding:17px 18px 13px}.branch-entry::before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#8fb392;border:3px solid #faf9f5;left:-35px;top:22px}.branch-entry.flip::before{background:#d9a576}.branch-entry.action::before{background:#ae9bbb}.branch-entry.link::before{background:#ce9997}.branch-entry.free::before{background:#c3b998}.branch-head{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;color:#9aa699;margin-bottom:8px}.branch-head strong{color:#607d65;font-weight:720}.branch-body{font-size:14px;color:#435248;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.86}.branch-connected{display:inline-flex;margin-top:10px;gap:6px;align-items:center;border:0;color:#607e64;background:#edf4e9;padding:7px 9px;border-radius:10px;font-size:11px}.branch-delete{border:0;background:none;color:#a5b0a5;padding:4px;font-size:11px}.branch-delete:hover{color:#af7878}.no-growth{border:1px dashed #dce8d7;border-radius:17px;padding:26px;text-align:center;font-size:13px;line-height:1.7;color:#93a192}.detail-bottom{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding:22px 0 0;margin:34px 0}.detail-bottom button{font-size:12px}

.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);padding:12px 18px;border-radius:40px;background:#263f2d;color:#fff;font-weight:650;font-size:12px;box-shadow:0 8px 30px #243a2e3d;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}.petals{position:fixed;pointer-events:none;z-index:25;inset:0;overflow:hidden}.petal{position:absolute;width:8px;height:12px;border-radius:70% 4px 70% 4px;background:#92b88e;left:var(--x);top:var(--y);animation:petalfly .95s ease-out forwards;transform:rotate(var(--r))}.petal:nth-child(3n){background:#d9bd9b}.petal:nth-child(4n){background:#d8c6dd}@keyframes petalfly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(205deg) scale(.5)}}
@media (max-width:730px){.shell{padding:0 21px 72px}.topbar{height:77px}.brand{font-size:33px}.capture{padding-top:clamp(40px,9vh,99px)}.hero-title{letter-spacing:-2.1px}.hero-title em{letter-spacing:-1.7px}.hero-desc{font-size:14px}.capture-card{padding:21px 20px 17px}.capture-card textarea{font-size:16px;height:174px}.detail-layout{display:flex;flex-direction:column;gap:4px}.detail-main{width:100%}.side-plant{width:100%;position:static;display:flex;gap:10px;align-items:center;padding:12px 17px;margin-top:8px;order:-1}.side-plant .plant-stage{width:80px;height:72px;flex:none;order:0}.side-plant .side-copy{order:1;flex:1}.side-plant .plant-count{display:none}.side-plant .plant-stage::after{bottom:3px}.detail-heading{margin:12px 0 20px}.detail-heading h1{font-size:28px}.idea-paper{padding:23px 22px}.idea-paper p{font-size:16px}.growth-title h2{font-size:18px}.choice{padding:15px 12px;gap:10px;min-height:114px}.choice-icon{width:33px;height:33px;border-radius:10px}.choice strong{font-size:13px}.choice span.caption{font-size:11px}.garden-grid{grid-template-columns:1fr;gap:12px}.seed-card{min-height:183px}.library-top{margin:28px 0 26px}.library-top h1{font-size:34px}.library-top .btn{font-size:12px;min-height:39px;padding:10px 12px}.pagehead{margin:21px 0}.searchbar{max-width:none}}
@media(max-width:390px){.top-actions{gap:12px}.navbtn{font-size:12px}.choices{grid-template-columns:1fr}.choice{min-height:80px}.hero-title{font-size:36px}.capture-card{padding:18px}.editor-bottom{flex-wrap:wrap}.inline-success{gap:8px;padding:13px}.inline-success .open{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="shell"><header class="topbar"><button class="brand" id="home-brand" aria-label="moru 홈">moru<span class="brand-dot">.</span></button><nav class="top-actions" id="top-actions" aria-label="메인 메뉴"></nav></header><main id="app"></main></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" accept=".json,application/json" id="restore-file" hidden>
<script>(()=>{'use strict';
const KEY='moru_v8_data',OLD_V7='moru_v7_data',OLD_V6='moru_v6_notes',DRAFT='moru_v8_draft',MODE_PREFIX='moru_v8_composer_';
const $=id=>document.getElementById(id);
const APP=$('app'),NAV=$('top-actions'),OVERLAY=$('overlay'),TOAST=$('toast');
const svgPaths={sprout:'<path d="M12 22v-8"/><path d="M12 14C4 14 3 8 3 5c6 0 9 3 9 9Z"/><path d="M12 13c0-6 3-9 9-9 0 5-2 9-9 9Z"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',back:'<path d="m15 18-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3Z"/><path d="m19 19 1 3m-2-2 3 1"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',reverse:'<path d="M21 7H7a4 4 0 0 0-4 4v1"/><path d="m7 3-4 4 4 4"/><path d="M3 17h14a4 4 0 0 0 4-4v-1"/><path d="m17 21 4-4-4-4"/>',zap:'<path d="m13 2-9 12h7l-1 8 10-12h-7V2Z"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.4l3-3A5 5 0 0 0 13.4 3L12 4.4"/><path d="M14 11a5 5 0 0 0-7.5-.4l-3 3A5 5 0 0 0 10.6 21L12 19.6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/>',upload:'<path d="M12 21V9m-4 4 4-4 4 4M5 7V3h14v4"/>',pencil:'<path d="m12 20 9-9-6-6-9 9-2 8 8-2Z"/><path d="m13.5 6.5 4 4"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',shuffle:'<path d="M3 17h3a4 4 0 0 0 3-1l6-8a4 4 0 0 1 3-1h3M18 4l3 3-3 3M3 7h3a4 4 0 0 1 3 1l1 1m4 6 1 1a4 4 0 0 0 3 1h3m-3-3 3 3-3 3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
function icon(name,cls='icon'){return `<svg class="${cls}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true">${svgPaths[name]||svgPaths.spark}</svg>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,11)}
function get(k){try{return localStorage.getItem(k)}catch(_){return null}}
function put(k,v){try{localStorage.setItem(k,v);return true}catch(_){return false}}
function remove(k){try{localStorage.removeItem(k)}catch(_){}}
function when(ts){const date=new Date(ts);return isNaN(+date)?'':new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(date)}
function relative(ts){const diff=Date.now()-Number(ts||0);const days=Math.max(0,Math.floor(diff/86400000));return days===0?'오늘':days===1?'어제':days<7?`${days}일 전`:when(ts)}
function title(n){return (n.title||n.body.split(/\n/)[0]).trim().slice(0,92)||'이름 없는 생각'}
function excerpt(n,max=50){return n.body.replace(/\s+/g,' ').trim().slice(0,max)+(n.body.length>max?'…':'')}
function stage(n){const k=n.entries.length;return k===0?0:k===1?1:k<4?2:3}
const stageNames=['씨앗','새싹','가지','꽃'];
function plant(n,cls='plant-svg'){const s=stage(n);const soil='<ellipse class="soil" cx="100" cy="172" rx="47" ry="10"/>';const seed='<ellipse class="seed" cx="100" cy="165" rx="11" ry="8"/>';if(s===0)return `<svg class="${cls}" viewBox="0 0 200 195" aria-hidden="true"><circle class="spark" cx="139" cy="95" r="3"/><circle class="spark" cx="61" cy="118" r="2"/>${soil}${seed}</svg>`;
let res=`<svg class="${cls}" viewBox="0 0 200 195" aria-hidden="true">${soil}<path class="stem" d="M100 167 Q91 140 101 113 Q108 92 100 78"/><path class="leaf" d="M101 131 C72 131 62 105 59 98 C85 97 104 111 101 131Z"/><path class="leaf l2" d="M100 114 C130 118 142 93 146 85 C120 83 98 97 100 114Z"/>`;
if(s>=2)res+=`<path class="stem" d="M100 124 Q115 94 132 70"/><path class="leaf l3" d="M132 72 C119 46 138 33 148 30 C160 51 148 67 132 72Z"/><path class="leaf l4" d="M106 98 C83 90 78 68 82 53 C104 60 114 78 106 98Z"/>`;
if(s>=3)res+=`<circle class="flower" cx="100" cy="73" r="12"/><circle class="flower" cx="114" cy="66" r="12"/><circle class="flower" cx="114" cy="82" r="12"/><circle class="flower" cx="99" cy="89" r="12"/><circle class="flower-mid" cx="107" cy="78" r="8"/><circle class="spark" cx="67" cy="64" r="3"/><circle class="spark" cx="156" cy="52" r="4"/>`;
return res+'</svg>'}
const MODES={clear:{title:'더 또렷하게',desc:'마음속 생각의 핵심을 찾아봐',icon:'sun',label:'조금 더 선명해진 생각',prompts:[
'이 생각에서 꼭 남기고 싶은 한 가지는 뭘까?','처음 이 생각이 떠올랐을 때, 뭐가 가장 마음에 걸렸어?','친구에게 딱 한 문장으로 들려준다면?','가장 끌리는 부분과 아직 흐릿한 부분을 나눠볼까?','이 생각이 해결했으면 하는 아주 작은 불편은?','이 생각을 떠올렸을 때 머릿속에 그려진 장면은?','이 아이디어를 지금 붙잡고 싶은 이유는 뭘까?','나중에 다시 읽을 내가 알아야 할 단서는 뭐야?']},
flip:{title:'뒤집어 보기',desc:'익숙한 방향에서 살짝 벗어나 봐',icon:'reverse',label:'다른 각도에서 본 생각',prompts:[
'정반대가 답이라면 어떤 모습일까?','이 생각이 실패한다면 가장 그럴듯한 이유는 뭘까?','내가 당연하다고 여긴 조건 하나를 없앤다면?','이 생각을 별로라고 느낄 사람은 무슨 말을 할까?','지금보다 열 배 작게 시작해야 한다면 뭘 남길까?','이 생각을 처음 듣는 사람에게 가장 낯선 부분은?','만약 해결책이 아니라 문제 자체를 바꾼다면?','지금 떠오른 해결책이 오히려 문제라면?']},
action:{title:'작게 시작하기',desc:'언젠가가 아닌 오늘의 한 걸음',icon:'zap',label:'작은 실험',prompts:[
'10분만 쓸 수 있다면 무엇부터 확인할래?','이게 필요할 것 같은 사람 한 명을 떠올려 봐. 무엇을 물어볼까?','돈을 쓰지 않고 가장 빠르게 확인할 수 있는 건?','완성품 대신 종이나 메모로 보여줄 수 있을까?','내일 한 가지 행동만 한다면 뭐가 좋을까?','이 생각이 틀렸다는 걸 가장 쉽게 알 방법은?','딱 일주일만 해볼 실험이라면?','이미 갖고 있는 도구만 쓴다면 어떻게 시작할까?']}};
let notes=[],view='capture',currentId=null,compose=null,searchText='',filter='all',captureDone=null,editing=false,showFinish=false,toastTimer=null,warning='';
function normal(raw){if(!raw||typeof raw!=='object')return null;const body=String(raw.body??raw.text??raw.content??'').trim();if(!body)return null;let entries=Array.isArray(raw.entries)?raw.entries:Array.isArray(raw.growth)?raw.growth:[];entries=entries.filter(v=>v&&typeof v.body==='string'&&v.body.trim()).map(e=>({id:typeof e.id==='string'?e.id:uid(),type:['clear','flip','action','link','free','legacy'].includes(e.type)?e.type:'legacy',body:e.body,created:Number(e.created)||Date.now(),label:typeof e.label==='string'?e.label:typeof e.question==='string'?e.question:'이어진 생각',promptId:typeof e.promptId==='string'?e.promptId:null,linkId:typeof e.linkId==='string'?e.linkId:null}));return {id:typeof raw.id==='string'?raw.id:uid(),body,title:typeof raw.title==='string'?raw.title:'',created:Number(raw.created)||Date.now(),updated:Number(raw.updated)||Number(raw.created)||Date.now(),entries,seen:raw.seen&&typeof raw.seen==='object'?{clear:Array.isArray(raw.seen.clear)?raw.seen.clear:[],flip:Array.isArray(raw.seen.flip)?raw.seen.flip:[],action:Array.isArray(raw.seen.action)?raw.seen.action:[]}: {clear:[],flip:[],action:[]},favorite:!!raw.favorite,closedAt:Number(raw.closedAt)||null,takeaway:typeof raw.takeaway==='string'?raw.takeaway:''}}
function bootstrap(){try{const curr=get(KEY);if(curr){const data=JSON.parse(curr);notes=(Array.isArray(data)?data:data.notes).map(normal).filter(Boolean);return}const prev=get(OLD_V7)||get(OLD_V6);if(prev){const raw=JSON.parse(prev);const items=Array.isArray(raw)?raw:raw.notes;if(Array.isArray(items)){notes=items.map(normal).filter(Boolean);if(!put(KEY,JSON.stringify({app:'moru',version:8,notes})))warning='저장 공간에 접근할 수 없어. 지금 작성한 기록은 남지 않을 수 있어.'}}}catch(e){warning='기존 기록을 읽지 못했어. 삭제하지 않고 그대로 두었어.'}}
function persist(){return put(KEY,JSON.stringify({app:'moru',version:8,notes}))}
function change(id,fn){let snapshot=JSON.stringify(notes);const note=notes.find(n=>n.id===id);if(!note)return false;fn(note);note.updated=Date.now();if(!persist()){notes=JSON.parse(snapshot);notify('저장에 실패했어. 기기 저장 공간을 확인해 줘.');return false}return true}
function notify(t){TOAST.textContent=t;TOAST.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>TOAST.classList.remove('show'),3200)}
function sparkle(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=document.createElement('div');box.className='petals';for(let i=0;i<13;i++){const p=document.createElement('span');p.className='petal';p.style.setProperty('--x',`${38+Math.random()*24}%`);p.style.setProperty('--y',`${42+Math.random()*21}%`);p.style.setProperty('--r',`${Math.random()*110}deg`);p.style.setProperty('--dx',`${Math.random()*270-135}px`);p.style.setProperty('--dy',`${Math.random()*-260-30}px`);box.append(p)}document.body.append(box);setTimeout(()=>box.remove(),1050)}
function getNote(){return notes.find(n=>n.id===currentId)}
function nav(){NAV.innerHTML=view==='capture'?`<button class="navbtn" id="goto-library">내 정원 <span class="count">${notes.length}</span> ${icon('arrow')}</button>`:`<button class="navbtn" id="goto-capture">${icon('plus')} 새 기록</button><button class="navbtn" id="goto-library">내 정원 <span class="count">${notes.length}</span></button>`;const go=$('goto-library');if(go)go.onclick=()=>route('library');const cap=$('goto-capture');if(cap)cap.onclick=()=>route('capture')}
function route(next,id){view=next;currentId=id??currentId;compose=null;editing=false;showFinish=false;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){nav();APP.className='view';if(view==='capture')capture();else if(view==='library')library();else if(view==='detail')detail();else route('capture')}
function capture(){APP.innerHTML=`<section class="capture"><span class="overline">A LITTLE SPACE FOR IDEAS</span><h1 class="hero-title">스쳐 간 생각도<br><em>자라날 수 있으니까.</em></h1><p class="hero-desc">거창한 아이디어가 아니어도 좋아.<br>일단 여기 남겨두자. 나중에 어떻게 자랄지는 모르니까.</p><div class="capture-card" id="capture-card"><textarea id="capture-input" aria-label="새로운 생각 기록" maxlength="10000" placeholder="방금 어떤 생각이 스쳤어?"></textarea><div class="editor-bottom"><span class="quiet" id="capture-hint">${warning?esc(warning):'말이 덜 된 생각도 괜찮아'}</span><button class="btn btn-primary" id="capture-save" disabled>생각 남기기 ${icon('arrow')}</button></div></div><div id="capture-feedback" aria-live="polite"></div><div class="tiny-orbit"><span class="orbit-leaf"></span><span class="orbit-dot"></span></div><p class="under-capture">기록은 이 기기에 남아 있어 · <button id="capture-backup">백업하기</button></p></section>`;const input=$('capture-input'),save=$('capture-save');input.value=get(DRAFT)||'';save.disabled=!input.value.trim();input.addEventListener('input',()=>{put(DRAFT,input.value);save.disabled=!input.value.trim();if(captureDone){$('capture-feedback').innerHTML='';captureDone=null}});save.onclick=()=>{const body=input.value.trim();if(!body)return;const now=Date.now();const note=normal({id:uid(),body,created:now});notes.unshift(note);if(!persist()){notes.shift();notify('저장하지 못했어. 저장 공간을 확인해 줘.');return}remove(DRAFT);input.value='';save.disabled=true;captureDone=note.id;nav();$('capture-feedback').innerHTML=`<div class="inline-success"><span class="seal">${icon('sprout')}</span><div><strong>생각을 남겼어.</strong><small>원할 때 언제든 이어갈 수 있어.</small></div><button class="open" id="open-new">지금 키워보기 ${icon('arrow')}</button></div>`;$('open-new').onclick=()=>route('detail',note.id);$('capture-card').classList.remove('success-pulse');void $('capture-card').offsetWidth;$('capture-card').classList.add('success-pulse');sparkle()};$('capture-backup').onclick=openSettings}
function library(){APP.innerHTML=`<section class="section-shell"><div class="library-top"><div><span class="eyebrow">MY LITTLE GARDEN</span><h1>나의 정원<span style="color:#adbe9e">.</span></h1><p>${notes.length?`${notes.length}개의 생각이 여기서 쉬고 있어.`:'아직 첫 생각을 기다리고 있어.'}</p></div><button class="btn btn-soft btn-small" id="new-note">${icon('plus')} 새 기록</button></div><div class="searchbar">${icon('search')}<input id="library-search" type="search" placeholder="생각을 찾아봐" aria-label="기록 검색"></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">전체</button><button class="filter ${filter==='growing'?'active':''}" data-filter="growing">자라는 중</button><button class="filter ${filter==='favorite'?'active':''}" data-filter="favorite">아껴둔 생각 ♡</button><button class="filter ${filter==='closed'?'active':''}" data-filter="closed">잠시 마무리</button></div><div class="garden-grid" id="garden-grid"></div><div class="library-footer"><button id="backups">백업 · 불러오기</button><button id="surprise">${icon('shuffle')} 뜻밖의 생각 하나 꺼내기</button></div></section>`;$('new-note').onclick=()=>route('capture');$('backups').onclick=openSettings;$('surprise').onclick=()=>{if(!notes.length){notify('먼저 생각 하나를 남겨봐.');return}const n=notes[Math.floor(Math.random()*notes.length)];route('detail',n.id)};$('library-search').value=searchText;$('library-search').oninput=e=>{searchText=e.target.value;drawGrid()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;library()});drawGrid()}
function drawGrid(){const grid=$('garden-grid');if(!grid)return;let filtered=notes.filter(n=>filter==='all'||(filter==='growing'&&!n.closedAt&&n.entries.length>0)||(filter==='favorite'&&n.favorite)||(filter==='closed'&&n.closedAt));if(searchText.trim()){const q=searchText.trim().toLowerCase();filtered=filtered.filter(n=>[n.body,n.title,n.takeaway,...n.entries.map(e=>e.body)].join(' ').toLowerCase().includes(q))}filtered.sort((a,b)=>Number(b.favorite)-Number(a.favorite)||b.updated-a.updated);if(!filtered.length){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1">${icon('sprout')}<strong>${notes.length?'아직 여기엔 생각이 없어.':'첫 생각을 심어볼까?'}</strong><p>${notes.length?'다른 필터나 검색어로 찾아봐.':'사소한 메모 하나면 충분해.'}</p>${!notes.length?'<button class="btn btn-soft" id="empty-new">생각 남기기</button>':''}</div>`;if($('empty-new'))$('empty-new').onclick=()=>route('capture');return}grid.innerHTML=filtered.map((n,i)=>`<button type="button" class="seed-card tone-${i%4}" data-note="${esc(n.id)}"><div class="seed-head"><span>${relative(n.created)} · ${stageNames[stage(n)]}</span><span class="pin">${n.favorite?'♥':''}</span></div><p class="seed-content">${esc(title(n))}</p><div class="seed-foot">${n.closedAt?'오늘은 여기까지':n.entries.length?`이어진 생각 ${n.entries.length}개`:'이제 막 남겨둔 생각'} ${icon('arrow')}</div><div class="seed-art">${plant(n)}</div></button>`).join('');grid.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>route('detail',b.dataset.note))}
function detail(){const n=getNote();if(!n){route('library');return}const closed=!!n.closedAt;APP.innerHTML=`<section class="section-shell"><button class="return" id="back-library">${icon('back')} 내 정원</button><div class="detail-layout"><div class="detail-main"><div class="detail-heading"><span class="eyebrow">AN IDEA, STILL GROWING</span><h1>${closed?'오늘은 여기까지.':'이 생각, 어디로 가볼까?'}</h1><small>${closed?'여기서 멈춰도 괜찮아. 다음에 다시 이어갈 수 있어.':'고민하지 말고 마음에 드는 방향 하나만 골라봐.'}</small></div><article class="idea-paper"><div class="paper-meta"><span>처음의 생각 · ${when(n.created)}</span><span class="status">${stageNames[stage(n)]}</span></div><p>${esc(n.body)}</p><div class="paper-actions"><button id="edit-original">${icon('pencil')} 수정</button><button id="fav-original">${icon('heart')} ${n.favorite?'아껴둠 ♥':'아껴두기'}</button></div></article><div id="edit-panel"></div>${closed?closedBlock(n):growthActions(n)}<div id="composer-root"></div><div class="group-title"><h2>이어진 생각 <span style="font-size:12px;color:#9ba99b;font-weight:500">${n.entries.length}</span></h2></div><div id="entry-list"></div><div class="detail-bottom"><button class="textbtn" id="copy-all">${icon('copy')} 내용 복사</button><button class="textbtn" id="delete-note" style="color:#ac8883">${icon('trash')} 기록 삭제</button></div></div><aside class="side-plant"><div class="plant-stage">${plant(n)}</div><div class="side-copy"><h3>${stageNames[stage(n)]}이 된 생각</h3><p>${n.entries.length?`처음의 생각에서 ${n.entries.length}개의 가지가 이어졌어.`:'아직 막 심은 생각이야. 어떻게 키울지는 네가 정해.'}</p><div class="plant-count"><span>이어진 생각</span><strong>${n.entries.length}개</strong></div></div></aside></div></section>`;$('back-library').onclick=()=>route('library');$('edit-original').onclick=()=>openEdit();$('fav-original').onclick=()=>{if(change(n.id,x=>x.favorite=!x.favorite)){render();notify(n.favorite?'아껴두는 생각으로 표시했어.':'아껴두기를 해제했어.')}};$('copy-all').onclick=()=>copyText(noteText(n));$('delete-note').onclick=()=>{if(!confirm('이 생각과 이어진 기록을 모두 삭제할까? 되돌릴 수 없어.'))return;const old=notes;notes=notes.filter(x=>x.id!==n.id);if(!persist()){notes=old;notify('삭제를 저장하지 못했어.');return}route('library');notify('기록을 삭제했어.')} ; document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));if($('free-entry'))$('free-entry').onclick=()=>selectMode('free');if($('finish-note'))$('finish-note').onclick=()=>finishForm();if($('resume-note'))$('resume-note').onclick=()=>{if(change(n.id,x=>x.closedAt=null)){render();notify('언제든 다시 이어갈 수 있어.')}};drawEntries();if(compose)drawComposer()}
function growthActions(n){return `<div class="growth-title"><h2>어디로 키워볼까?</h2><small>정해진 순서는 없어</small></div><div class="choices"><button class="choice" data-mode="clear"><span class="choice-icon">${icon('sun')}</span><span><strong>더 또렷하게</strong><span class="caption">생각의 중심을 찾아봐</span></span></button><button class="choice flip" data-mode="flip"><span class="choice-icon">${icon('reverse')}</span><span><strong>뒤집어 보기</strong><span class="caption">다른 눈으로 들여다봐</span></span></button><button class="choice action" data-mode="action"><span class="choice-icon">${icon('zap')}</span><span><strong>작게 시작하기</strong><span class="caption">지금 할 수 있는 한 가지</span></span></button><button class="choice link" data-mode="link"><span class="choice-icon">${icon('link')}</span><span><strong>생각 연결하기</strong><span class="caption">다른 기록과 섞어봐</span></span></button></div><div class="choice-footer"><button class="textbtn" id="free-entry">${icon('pencil')} 그냥 내 생각 이어 쓰기</button>${n.entries.length?`<button class="textbtn" id="finish-note">${icon('check')} 오늘은 여기까지</button>`:''}</div>`}
function closedBlock(n){return `<section class="finished-banner"><h3>${icon('check')} 여기까지의 생각을 간직했어.</h3><p>마무리는 끝이 아니라 책갈피야. 언제든 다시 펼쳐볼 수 있어.</p>${n.takeaway?`<p class="highlight">“${esc(n.takeaway)}”</p>`:''}<button class="btn btn-soft btn-small" id="resume-note">${icon('plus')} 다시 이어가기</button></section>`}
function openEdit(){editing=!editing;const box=$('edit-panel');if(!editing){box.innerHTML='';return}const n=getNote();box.innerHTML=`<div class="compose"><div class="compose-top"><span class="mode-label">처음의 기록 다듬기</span><button class="xbtn" id="edit-close">${icon('x')}</button></div><h3>조금 고쳐도 괜찮아.</h3><textarea id="edit-text" maxlength="10000" aria-label="기록 수정"></textarea><div class="compose-actions"><small>이전에 이어 쓴 생각은 그대로 남아.</small><button class="btn btn-primary" id="edit-save">수정 저장</button></div></div>`;$('edit-text').value=n.body;$('edit-close').onclick=()=>{editing=false;box.innerHTML=''};$('edit-save').onclick=()=>{const value=$('edit-text').value.trim();if(!value){notify('내용을 적어줘.');return}if(change(n.id,x=>x.body=value)){editing=false;render();notify('수정한 내용을 저장했어.')}};setTimeout(()=>$('edit-text')?.focus(),25)}
function unseen(n,mode){const seen=new Set(n.seen?.[mode]||[]),p=MODES[mode]?.prompts||[];return p.map((t,i)=>({text:t,id:mode+'-'+i})).filter(x=>!seen.has(x.id))}
function selectMode(mode){const n=getNote();if(!n||n.closedAt)return;const options=mode==='link'?notes.filter(x=>x.id!==n.id):null;if(mode==='link'&&!options.length){notify('다른 생각이 하나 더 생기면 연결할 수 있어.');return}compose={mode,linkId:null,prompt:null};if(MODES[mode]){const unseenPrompts=unseen(n,mode);if(unseenPrompts.length)compose.prompt=unseenPrompts[0]};drawComposer();document.querySelector('#composer-root')?.scrollIntoView({behavior:'smooth',block:'center'})}
function drawComposer(){const target=$('composer-root'),n=getNote();if(!target||!compose||!n)return;const c=compose,mode=c.mode,conf=MODES[mode];let label=conf?.title|| (mode==='link'?'생각 연결하기':'자유롭게 이어 쓰기');let prompt=conf?(c.prompt?c.prompt.text:'이 방향에서는 충분히 둘러봤어. 이제 네 생각을 자유롭게 이어가도 좋아.'):(mode==='link'?'두 생각을 한데 놓으면 뭐가 떠올라?':'어떤 말이든 괜찮아. 이어서 남겨봐.');const other=c.linkId?notes.find(x=>x.id===c.linkId):null;const links=mode==='link'?`<div class="link-select">${notes.filter(x=>x.id!==n.id).map(x=>`<button class="link-pick ${c.linkId===x.id?'active':''}" data-pick="${esc(x.id)}">${esc(excerpt(x,75))}</button>`).join('')}</div>${other?`<div class="selected-link">${icon('link')} 선택한 생각: ${esc(excerpt(other,45))}</div>`:''}`:'';target.innerHTML=`<section class="compose" id="compose-panel"><div class="compose-top"><span class="mode-label">${icon(mode==='link'?'link':mode==='free'?'pencil':conf.icon)} ${esc(label)}</span><button class="xbtn" id="compose-close" aria-label="닫기">${icon('x')}</button></div><h3>${esc(prompt)}</h3><p class="sub">${mode==='free'?'메모하듯 편하게 이어가면 돼.':mode==='link'?'연결할 다른 생각을 골라봐.':'정답을 쓰는 곳이 아니야. 떠오르는 만큼만 남겨봐.'}</p>${links}${conf?`<div class="prompt-row"><button id="next-prompt">${icon('shuffle')} 다른 실마리 보기</button><button id="no-prompt">질문 없이 쓸래</button></div>`:''}<textarea id="compose-input" maxlength="10000" placeholder="머릿속에 떠오르는 대로 적어봐" aria-label="이어진 생각 작성"></textarea><div class="compose-actions"><small>원하는 만큼 쓰고 여기서 끝내도 돼</small><button class="btn btn-primary" id="compose-save" disabled>생각 붙이기 ${icon('plus')}</button></div></section>`;const input=$('compose-input'),saved=get(MODE_PREFIX+n.id+'_'+mode);if(saved)input.value=saved;const save=$('compose-save');function validate(){save.disabled=!input.value.trim()||(mode==='link'&&!compose.linkId)}input.addEventListener('input',()=>{put(MODE_PREFIX+n.id+'_'+mode,input.value);validate()});validate();$('compose-close').onclick=()=>{compose=null;target.innerHTML=''};if(conf){$('next-prompt').onclick=()=>{const unseenP=unseen(n,mode);const next=unseenP.find(x=>x.id!==compose.prompt?.id);if(compose.prompt){change(n.id,x=>{x.seen[mode].push(compose.prompt.id)})}compose.prompt=next||unseen(n,mode)[0]||null;const text=input.value;drawComposer();$('compose-input').value=text;$('compose-input').dispatchEvent(new Event('input'));};$('no-prompt').onclick=()=>{compose.prompt=null;const val=input.value;drawComposer();$('compose-input').value=val;$('compose-input').dispatchEvent(new Event('input'))}}if(mode==='link'){target.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const val=input.value;compose.linkId=b.dataset.pick;drawComposer();$('compose-input').value=val;$('compose-input').dispatchEvent(new Event('input'));})}save.onclick=()=>{const body=input.value.trim();if(!body)return;if(mode==='link'&&!compose.linkId){notify('연결할 생각을 골라봐.');return}const cur=compose;const answerLabel=mode==='link'?'생각을 연결했어':mode==='free'?'이어 쓴 생각':conf.label;if(change(n.id,x=>{x.entries.push({id:uid(),type:mode,body,created:Date.now(),label:answerLabel,promptId:cur.prompt?.id||null,linkId:cur.linkId||null});if(conf&&cur.prompt&&!x.seen[mode].includes(cur.prompt.id))x.seen[mode].push(cur.prompt.id);x.closedAt=null})){remove(MODE_PREFIX+n.id+'_'+mode);compose=null;render();sparkle();notify('생각이 하나 더 자랐어.')}};
}
function drawEntries(){const box=$('entry-list'),n=getNote();if(!box||!n)return;const entries=n.entries.slice().sort((a,b)=>a.created-b.created);if(!entries.length){box.innerHTML=`<div class="no-growth">아직 이어진 생각이 없어.<br>위에서 마음에 드는 방향 하나만 골라봐.</div>`;return}box.innerHTML=`<div class="timeline">${entries.map(e=>{const other=e.linkId?notes.find(x=>x.id===e.linkId):null;return `<article class="branch-entry ${esc(e.type)}"><div class="branch-head"><span><strong>${esc(e.label)}</strong> · ${relative(e.created)}</span><button aria-label="이어진 생각 삭제" class="branch-delete" data-remove="${esc(e.id)}">삭제</button></div><div class="branch-body">${esc(e.body)}</div>${other?`<button class="branch-connected" data-linked="${esc(other.id)}">${icon('link')} ${esc(excerpt(other,47))}</button>`:''}</article>`}).join('')}</div>`;box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!confirm('이렇게 이어 쓴 생각을 삭제할까?'))return;if(change(n.id,x=>x.entries=x.entries.filter(e=>e.id!==b.dataset.remove))){render();notify('이어진 생각을 삭제했어.')}});box.querySelectorAll('[data-linked]').forEach(b=>b.onclick=()=>route('detail',b.dataset.linked))}
function finishForm(){const n=getNote();if(!n||!n.entries.length)return;const slot=$('composer-root');showFinish=!showFinish;if(!showFinish){slot.innerHTML='';return}compose=null;slot.innerHTML=`<section class="finish-card"><span class="eyebrow">A LITTLE BOOKMARK</span><h2>오늘은 여기까지 생각해 볼까?</h2><p>지금 가장 마음에 드는 발견이 있다면 한 줄만 남겨봐.<br>비워둬도 괜찮아. 언제든 다시 시작할 수 있어.</p><textarea id="finish-input" maxlength="300" placeholder="예: 완벽한 앱보다 기록하는 습관이 먼저다."></textarea><div class="finish-actions"><button class="btn btn-primary" id="finish-save">${icon('check')} 여기까지 남기기</button><button class="btn btn-plain" id="finish-cancel">조금 더 생각할래</button></div></section>`;$('finish-input').value=n.takeaway||'';$('finish-save').onclick=()=>{const takeaway=$('finish-input').value.trim();if(change(n.id,x=>{x.closedAt=Date.now();x.takeaway=takeaway})){showFinish=false;render();sparkle();notify('오늘의 생각을 잘 접어뒀어.')}};$('finish-cancel').onclick=()=>{showFinish=false;slot.innerHTML=''};slot.scrollIntoView({behavior:'smooth',block:'center'})}
function noteText(n){return `처음의 생각 · ${when(n.created)}\n\n${n.body}`+(n.entries.length?'\n\n이어진 생각\n'+n.entries.map(x=>`\n[${x.label}]\n${x.body}`).join('\n'):'')+(n.takeaway?`\n\n오늘의 한 줄\n${n.takeaway}`:'')}
async function copyText(text){try{if(!navigator.clipboard?.writeText)throw Error('clipboard');await navigator.clipboard.writeText(text);notify('내용을 복사했어.')}catch(e){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.left='-10000px';document.body.append(area);area.select();const success=document.execCommand?.('copy');area.remove();if(success)notify('내용을 복사했어.');else prompt('내용 복사',text)}}
function openSettings(){OVERLAY.hidden=false;OVERLAY.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="내 기록 관리"><div class="modal-head"><h2>내 기록 관리</h2><button id="modal-close" aria-label="닫기">${icon('x')}</button></div><div class="modal-row"><strong>${icon('download')} 기록 백업</strong><p>내 생각을 JSON 파일로 보관할 수 있어.</p><button class="btn btn-soft btn-small" id="export-notes">백업 파일 저장</button></div><div class="modal-row"><strong>${icon('upload')} 백업 불러오기</strong><p>기존 기록을 지우지 않고 합쳐. v6, v7 백업도 읽을 수 있어.</p><button class="btn btn-light btn-small" id="import-notes">파일 선택</button></div><p class="modal-note">현재 버전은 계정이나 서버 없이 동작해. 기록은 이 브라우저에 저장되므로 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있어. 가끔 백업해 두는 게 좋아.</p></div>`;OVERLAY.onclick=e=>{if(e.target===OVERLAY)closeSettings()};$('modal-close').onclick=closeSettings;$('export-notes').onclick=exportNotes;$('import-notes').onclick=()=>$('restore-file').click();setTimeout(()=>$('modal-close')?.focus(),25)}
function closeSettings(){OVERLAY.hidden=true;OVERLAY.innerHTML=''}
function exportNotes(){const json=JSON.stringify({app:'moru',version:8,exportedAt:new Date().toISOString(),notes},null,2),blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`moru-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('백업 파일을 만들었어.')}
$('restore-file').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>9e6)throw Error('파일이 너무 커.');const data=JSON.parse(await file.text()),arr=Array.isArray(data)?data:data?.notes;if(!Array.isArray(arr))throw Error('기록 목록이 없어.');const incoming=arr.map(normal).filter(Boolean);if(!confirm(`${incoming.length}개의 기록을 불러올까? 지금 기록은 그대로 둬.`))return;const prev=notes;const ids=new Set(notes.map(x=>x.id));const added=incoming.filter(n=>!ids.has(n.id));notes=[...added,...notes];if(!persist()){notes=prev;throw Error('저장에 실패했어.')}closeSettings();filter='all';searchText='';route('library');notify(`${added.length}개의 생각을 불러왔어.`)}catch(err){notify('파일을 불러오지 못했어: '+err.message)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!OVERLAY.hidden)closeSettings()});$('home-brand').onclick=()=>route('capture');bootstrap();render();
})();
</script>
