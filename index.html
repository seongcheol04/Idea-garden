const ready=n=>Object.values(n.fields||{}).filter(s=>s.trim()).length;
const complete=n=>(n.experiments||[]).filter(x=>x.status==='done').length;
function stage(n){if(complete(n)>0)return 3;if((n.experiments||[]).length>0||ready(n)>=3)return 2;if(n.entries.length||ready(n)>0||(n.links||[]).length)return 1;return 0}
const stages=['씨앗','새싹','가지','꽃'];
function plant(n,cls='plant-svg'){const s=stage(n);const soil='<ellipse class="ground" cx="100" cy="170" rx="48" ry="9"/>';if(s===0)return `<svg class="${cls}" viewBox="0 0 200 190" aria-hidden="true">${soil}<ellipse class="seed" cx="100" cy="161" rx="11" ry="8"/><circle class="spark" cx="136" cy="99" r="3"/></svg>`;let h=`<svg class="${cls}" viewBox="0 0 200 190" aria-hidden="true">${soil}<path class="stem" d="M100 169Q97 146 100 121Q104 102 102 73"/><path class="leaf" d="M100 144C76 145 65 124 60 112c24-2 39 11 40 32Z"/><path class="leaf second" d="M100 126C129 130 141 109 145 96c-25-2-44 10-45 30Z"/>`;if(s>=2)h+='<path class="leaf" d="M102 104C84 99 78 78 79 66c20 6 25 20 23 38Z"/><path class="leaf second" d="M102 88C123 90 139 76 144 63c-22-3-38 8-42 25Z"/>';if(s>=3)h+='<circle class="flower" cx="102" cy="64" r="18"/><circle class="flower" cx="88" cy="59" r="12"/><circle class="flower" cx="117" cy="53" r="12"/><circle class="flower-center" cx="102" cy="63" r="8"/>';return h+'</svg>'}

const jump=(s,id)=>{screen=s;if(id)activeId=id;studio=null;lens=null;render();window.scrollTo({top:0,behavior:'instant'})};

function render(){nav();APP.className='view';APP.innerHTML=screen==='capture'?capture():screen==='garden'?garden():screen==='playground'?playground():screen==='lab'?lab():screen==='discover'?discover():screen==='detail'&&note()?detail():capture();const cap=$('capture-input');if(cap){cap.value=get(DRAFT)||'';const b=$('capture-save');b.disabled=!cap.value.trim()}const q=$('search-input');if(q)q.value=search;const tryEl=$('studio-body');if(tryEl&&studio)attachStudio();}
function capture(){const last=notes.slice().sort((a,b)=>b.updated-a.updated)[0];const pending=notes.flatMap(n=>n.experiments.filter(e=>e.status==='todo').map(e=>({n,e}))).sort((a,b)=>b.e.created-a.e.created)[0];return `<section class="capture"><span class="eyebrow">SMALL THOUGHTS, BIG POSSIBILITIES</span><h1 class="hero">떠오른 생각,<br><em>그냥 흘려보내지 마.</em></h1><p class="hero-desc">완성된 문장이 아니어도 좋아.<br>일단 남겨두면, 언젠가 다른 생각과 연결될 수 있으니까.</p><div class="entry-box" id="entry-box"><textarea id="capture-input" maxlength="14000" placeholder="지금 어떤 생각이 스쳤어?" aria-label="새로운 생각 기록"></textarea><div class="entry-foot"><span class="entry-hint">${warning?esc(warning):'간단하게, 아무 부담 없이'}</span><button class="btn primary" id="capture-save" data-action="capture-save" disabled>기록하기 ${I('arrow')}</button></div></div><div aria-live="polite" id="capture-feedback">${savedId?`<div class="capture-success"><div class="success-seal">${I('check','icon big')}</div><div><strong>생각을 잘 남겼어.</strong><small>원하면 지금 한 걸음 더 이어가 봐.</small></div><button class="link-button" data-action="open-saved">열어보기 ${I('arrow','icon small')}</button></div>`:''}</div><p class="capture-tip">기록은 지금 사용하는 브라우저에 저장돼. <button class="link-button" data-action="settings">백업하기</button></p>${pending?`<div class="home-nudge"><div><strong>잠깐, 이어갈 일이 하나 있어</strong><small>${esc(short(pending.e.title,55))}</small></div><button data-action="detail" data-id="${esc(pending.n.id)}">이어가기 ${I('arrow','icon small')}</button></div>`:last?`<div class="home-nudge"><div><strong>지난 생각, 다시 열어볼까?</strong><small>${esc(short(last.body,53))}</small></div><button data-action="detail" data-id="${esc(last.id)}">열기 ${I('arrow','icon small')}</button></div>`:''}</section>`}
function garden(){const count=notes.length, done=notes.reduce((s,n)=>s+complete(n),0), total=notes.reduce((s,n)=>s+n.experiments.length,0);const spotlight=notes.length>1?[...notes].filter(n=>n.created<Date.now()-864e5).sort((a,b)=>a.updated-b.updated)[0]||notes[notes.length-1]:notes[0];const match=n=>{let text=(n.body+' '+n.entries.map(e=>e.body).join(' ')+' '+Object.values(n.fields).join(' ')).toLowerCase();return (!search||text.includes(search.toLowerCase()))&&(filter==='all'||filter==='favorite'&&n.favorite||filter==='active'&&n.experiments.some(e=>e.status==='todo')||filter==='flower'&&complete(n)>0)};const chosen=notes.filter(match).sort((a,b)=>b.updated-a.updated);return `<section class="page-head"><span class="eyebrow">YOUR LITTLE GARDEN</span><h1 class="page-title">내 생각의 정원</h1><p class="sub">모아둔 생각이 얼마나 자랐는지, 필요한 순간에 다시 발견해 봐.</p></section><section class="garden-overview"><div class="stat-grid"><div class="stat"><span>남긴 생각</span><strong>${count}</strong></div><div class="stat"><span>진행 중인 실험</span><strong>${Math.max(0,total-done)}</strong></div><div class="stat"><span>끝낸 실험</span><strong>${done}</strong></div></div>${spotlight?`<div class="spotlight"><div class="body"><span class="eyebrow">다시 발견한 생각</span><p class="quote">${esc(short(spotlight.body,95))}</p><button class="link-button" data-action="detail" data-id="${esc(spotlight.id)}">이어서 보기 ${I('arrow','icon small')}</button></div>${plant(spotlight)}</div>`:''}</section><div class="section-title"><h2>나의 기록 <span class="pill">${count}</span></h2><button class="link-button" data-action="nav" data-screen="capture">${I('plus','icon small')} 새 기록</button></div><div class="toolstrip"><div class="searchbar">${I('search')}<input id="search-input" placeholder="생각 속에서 찾기" aria-label="기록 검색" autocomplete="off"/></div><div class="segments"><button class="segment ${filter==='all'?'selected':''}" data-action="filter" data-filter="all">전체</button><button class="segment ${filter==='favorite'?'selected':''}" data-action="filter" data-filter="favorite">아껴둔</button><button class="segment ${filter==='active'?'selected':''}" data-action="filter" data-filter="active">실험 중</button><button class="segment ${filter==='flower'?'selected':''}" data-action="filter" data-filter="flower">결과 있음</button></div></div><div class="garden-grid" id="garden-cards">${cards(chosen)}</div>${count?'<p class="footer-note">정원은 기록한 양보다, 실제로 생각하고 실험한 과정에 따라 자라.</p>':''}`}
function cards(arr){return arr.length?arr.map((n,i)=>`<button class="idea-card" data-action="detail" data-id="${esc(n.id)}" data-tone="${i%4}"><div class="idea-meta"><b>${esc(category(n))}</b> <span>·</span> ${esc(ago(n.updated))} ${n.favorite?' · ♥':''}</div><div class="idea-text">${esc(short(n.body,150))}</div><div class="idea-bottom">${esc(stages[stage(n)])} · ${n.experiments.length?`${complete(n)}/${n.experiments.length} 실험`:`${n.entries.length}개 가지`} ${I('arrow','icon small')}</div>${plant(n)}</button>`).join(''):`<div class="empty-state" style="grid-column:1/-1">${I('leaf')}<strong>${notes.length?'조건에 맞는 기록이 없어':'아직 심은 생각이 없어'}</strong><p>${notes.length?'검색어를 바꿔 보거나 다른 분류를 눌러 봐.':'한 줄의 기록부터 시작해 봐.'}</p><button class="btn solid" data-action="nav" data-screen="capture">${I('plus')} 생각 기록하기</button></div>`}
function pairScore(a,b){const aa=new Set(words(a.body).slice(0,45)),bb=new Set(words(b.body).slice(0,45));let match=[...aa].filter(x=>bb.has(x));let ca=category(a),cb=category(b);return {a,b,match,score:match.length/(Math.sqrt(aa.size*bb.size)||1),different:ca!==cb};}
function pairs(){const arr=[];for(let i=0;i<notes.length;i++)for(let j=i+1;j<notes.length;j++)arr.push(pairScore(notes[i],notes[j]));return arr;}
function pairList(){let arr=pairs();if(pairOverride){const [a,b]=pairOverride;const f=arr.find(x=>x.a.id===a&&x.b.id===b||x.a.id===b&&x.b.id===a);if(f)return [f,...arr.filter(x=>x!==f)]}if(pairMode==='similar')arr.sort((a,b)=>b.score-a.score||Number(b.different)-Number(a.different));else arr.sort((a,b)=>Number(b.different)-Number(a.different)||a.score-b.score);return arr}
const pairQuestions=[

 보기</small>두 아이디어를 따로 해결하는 대신 하나로 합칠 수 있을까? ${I('arrow','icon small')}</button><button data-action="pair-mode" data-mode="${pairMode==='similar'?'contrast':'similar'}"><small>관점 바꾸기</small>${pairMode==='similar'?'관련 없어 보이는 조합에서 새로운 가능성 찾기':'서로 닮은 생각 사이에서 반복되는 관심사 찾기'} ${I('arrow','icon small')}</button></div>`}`}

function lab(){const tasks=notes.flatMap(n=>n.experiments.map(e=>({n,e}))),pending=tasks.filter(x=>x.e.status!=='done').sort((a,b)=>b.e.created-a.e.created),done=tasks.filter(x=>x.e.status==='done').sort((a,b)=>(b.e.doneAt||0)-(a.e.doneAt||0));const good=notes.filter(n=>n.fields.problem||n.entries.length).slice(0,4);
return `<section class="page-head"><span class="eyebrow">MAKE IT REAL</span><h1 class="page-title">작은 실험실</h1><p class="sub">생각을 증명할 필요는 없어. 작게 해보고, 예상과 달랐던 것도 남겨 봐.</p></section><div class="lab-hero"><div><span class="eyebrow">LEARN BY DOING</span><h2>완벽한 계획보다,<br>작은 실행 한 번.</h2><p>친구 한 명에게 물어보거나 종이에 그려보는 것도 실험이야.</p><div class="lab-counts"><span><b>${pending.length}</b> 진행할 실험</span><span><b>${done.length}</b> 완료한 실험</span></div></div><div class="lab-illustration" aria-hidden="true"><div class="lab-orbit orbit-a"></div><div class="lab-orbit orbit-b"></div><div class="lab-flask">${I('flask','icon big')}</div><span>✳</span></div></div><section class="lab-section"><div class="section-title"><h2>해볼 실험 <span class="pill">${pending.length}</span></h2></div>${pending.length?`<div class="lab-list">${pending.map(({n,e})=>`<article class="lab-task"><div class="lab-task-body"><span class="eyebrow">${esc(category(n))} · ${esc(short(n.body,52))}</span><h3>${esc(e.title)}</h3><span class="tiny">${esc(ago(e.created))} 추가</span></div><div class="lab-task-actions"><button class="btn primary tiny" data-action="lab-finish" data-note="${esc(n.id)}" data-id="${esc(e.id)}">${I('check','icon small')} 결과 남기기</button><button class="btn ghost tiny" data-action="detail" data-id="${esc(n.id)}">생각 열기</button></div></article>`).join('')}</div>`:`<div class="lab-empty"><div class="lab-empty-symbol">✦</div><h3>아직 실험할 생각이 없어도 괜찮아.</h3><p>기록한 생각 하나를 고르고, 10분 안에 해볼 일을 만들어 봐.</p><button class="btn solid" data-action="lab-pick">실험할 생각 고르기 ${I('arrow')}</button></div>`}</section>${done.length?`<section class="lab-section"><div class="section-title"><h2>해보니 알게 된 것 <span class="pill">${done.length}</span></h2></div><div class="lab-results">${done.map(({n,e})=>`<button class="lab-result" data-action="detail" data-id="${esc(n.id)}"><span>완료 · ${esc(ago(e.doneAt||e.created))}</span><strong>${esc(e.title)}</strong><p>${esc(e.learning||e.result||'실험을 마쳤어.')}</p>${I('arrow','icon small')}</button>`).join('')}</div></section>`:''}<section class="lab-section"><div class="section-title"><h2>여기서 시작해 볼까?</h2><small>내 정원에서 고르기</small></div><div class="lab-start-grid">${good.length?good.map(n=>`<button data-action="lab-new" data-id="${esc(n.id)}"><span>${I('leaf','icon small')} ${esc(stages[stage(n)])}</span><strong>${esc(short(n.body,78))}</strong><small>이 생각으로 실험 만들기 ${I('arrow','icon small')}</small></button>`).join(''):`<button data-action="nav" data-screen="capture"><span>${I('plus','icon small')} 첫 생각</span><strong>먼저 떠오르는 생각 한 줄을 남겨 봐.</strong><small>기록하러 가기 ${I('arrow','icon small')}</small></button>`}</div></section>`;
}

function roadmap(n){const f=ready(n),e=n.experiments.length,d=complete(n);const text= !f&&!n.entries.length?'지금 떠오른 핵심을 한 문장으로 정리해 볼까?':f<3?'누구의 어떤 문제인지 더 또렷해질 차례야.':!e?'이 생각을 작게 시험해 볼 차례야.':!d?'이제 첫 실험을 실행하고 배운 걸 남겨 봐.':'검증한 내용을 바탕으로 다음 방향을 선택해 봐.';const action= !f&&!n.entries.length?'studio':'focus';const label= !f&&!n.entries.length?'생각 이어가기':f<3?'생각 구체화하기':!e?'실험 만들기':!d?'실험 확인하기':'한 장으로 정리하기';return{text,action:f>=3&&e===0?'new-exp':action,label};}
function detail(){const n=note(),r=roadmap(n),links=(n.links||[]).map(x=>notes.find(z=>z.id===x)).filter(Boolean),connections=pairs().filter(p=>p.a.id===n.id||p.b.id===n.id).sort((a,b)=>b.score-a.score).slice(0,2);return `<button class="back-link" data-action="nav" data-screen="garden">${I('back','icon small')} 내 정원</button><header class="detail-head"><div><span class="eyebrow">${esc(stages[stage(n)].toUpperCase())} · ${esc(category(n))}</span><h1>한 생각의 다음 장.</h1><p class="sub">기록은 그대로, 방향은 자유롭게.</p></div>${plant(n)}</header><div class="detail-grid"><div class="primary-content"><article class="card note-sheet"><div class="note-meta"><span>처음의 기록 · ${esc(day(n.created))}</span><span class="pill">${esc(stages[stage(n)])}</span></div><p class="note-body">${esc(n.body)}</p><div class="note-actions"><button class="link-button" data-action="edit-note">${I('edit','icon small')} 수정</button><button class="link-button" data-action="favorite">${I('heart','icon small')} ${n.favorite?'아껴둔 생각':'아껴두기'}</button><button class="link-button" data-action="share-note">${I('share','icon small')} 공유</button></div></article><section class="card studio" id="studio-section"><div class="studio-head"><div><span class="eyebrow">GROW IN YOUR OWN WAY</span><h2>어디로 키워볼까?</h2><p>정해진 순서는 없어. 지금 끌리는 쪽으로 가면 돼.</p></div></div><div class="studio-grid"><button class="studio-choice" data-action="studio" data-studio="focus"><span class="icon-wrap">${I('target')}</span><span><strong>핵심 잡기</strong><small>누구의 문제인지 또렷하게</small></span></button><button class="studio-choice" data-action="studio" data-studio="explore"><span class="icon-wrap">${I('flip')}</span><span><strong>관점 뒤집기</strong><small>다른 가능성 탐색하기</small></span></button><button class="studio-choice" data-action="studio" data-studio="experiment"><span class="icon-wrap">${I('zap')}</span><span><strong>작게 실험하기</strong><small>현실에서 한 번 시도하기</small></span></button><button class="studio-choice" data-action="studio" data-studio="free"><span class="icon-wrap">${I('edit')}</span><span><strong>그냥 이어 쓰기</strong><small>질문 없이 자유롭게</small></span></button></div><div id="studio-body">${studio?renderStudio(n):''}</div></section>${ready(n)>0?`<section><div class="section-title"><h2>한 장으로 정리</h2><button class="link-button" data-action="copy-summary">${I('copy','icon small')} 복사</button></div><div class="one-pager"><span class="eyebrow">IDEA SNAPSHOT</span><dl><dt>첫 생각</dt><dd>${esc(short(n.body,240))}</dd>${[['누구를 위해',n.fields.who],['어떤 문제',n.fields.problem],['어떤 방법',n.fields.solution],['다른 점',n.fields.difference]].filter(x=>x[1].trim()).map(([name,val])=>`<dt>${esc(name)}</dt><dd>${esc(val)}</dd>`).join('')}${n.takeaway?`<dt>지금의 결론</dt><dd>${esc(n.takeaway)}</dd>`:''}</dl></div></section>`:''}<section><div class="section-title"><h2>작은 실험 <span class="pill">${n.experiments.length}</span></h2><button class="link-button" data-action="new-exp">${I('plus','icon small')} 새 실험</button></div><div class="experiments">${n.experiments.length?n.experiments.map(e=>`<article class="experiment ${e.status==='done'?'done':''}"><div class="experiment-top"><div><strong>${esc(e.title)}</strong><br><small>${e.status==='done'?'완료 · '+esc(day(e.doneAt||e.created)):'진행 전 · '+esc(ago(e.created))}</small></div><span class="pill ${e.status==='done'?'':'amber'}">${e.status==='done'?'배움 기록':'시도해 보기'}</span></div>${e.status==='done'?`<p>${esc(e.result)}${e.learning?' · '+esc(e.learning):''}</p>`:''}<div class="button-row">${e.status!=='done'?`<button data-action="finish-exp" data-id="${esc(e.id)}">${I('check','icon small')} 결과 남기기</button>`:''}<button data-action="remove-exp" data-id="${esc(e.id)}">삭제</button></div></article>`).join(''):`<div class="empty-state"><strong>아직 실험은 없어</strong><p>완벽한 계획보다 10분짜리 시도 하나부터 시작해 봐.</p><button class="btn solid" data-action="new-exp">첫 실험 만들기 ${I('arrow')}</button></div>`}</div></section><section><div class="section-title"><h2>이어진 생각 <span class="pill">${n.entries.length}</span></h2><button class="link-button" data-action="studio" data-studio="free">${I('plus','icon small')} 덧붙이기</button></div><div class="timeline">${n.entries.length?n.entries.slice().sort((a,b)=>a.created-b.created).map(e=>`<article class="timeline-entry"><header><span>${esc(e.label||'이어진 생각')} · ${esc(ago(e.created))}</span><button data-action="remove-entry" data-id="${esc(e.id)}">삭제</button></header>${e.prompt?`<div class="prompt">${esc(e.prompt)}</div>`:''}<p>${esc(e.body)}</p></article>`).join(''):`<p class="tiny">생각을 더하면 이곳에 차곡차곡 남아.</p>`}</div></section><div class="detail-footer"><button class="link-button" data-action="copy-summary">${I('copy','icon small')} 내용 복사</button><button class="link-button" data-action="finish-note">${I('bookmark','icon small')} ${n.closedAt?'한 줄 결론 바꾸기':'지금의 결론 남기기'}</button><button class="link-button" style="color:#b17b76" data-action="delete-note">${I('trash','icon small')} 기록 삭제</button></div></div><aside class="side-stack"><div class="side-panel"><span class="eyebrow">NEXT LITTLE STEP</span>${plant(n)}<div class="next">${esc(r.text)}</div><button class="btn primary" data-action="${r.action}" ${r.action==='studio'?'data-studio="focus"':''}>${esc(r.label)} ${I('arrow','icon small')}</button><div class="metric-line">${I('leaf','icon small')} 구체화 ${ready(n)}/4 · 실험 완료 <b>${complete(n)}</b></div></div><div class="side-panel white"><h3>${I('link','icon small')} 다른 생각과 만나기</h3><p>${notes.length<=1?'기록이 하나 더 생기면 생각을 연결할 수 있어.':`관련 단어와 주제를 단서로 ${connections.length}개의 조합을 골랐어.`}</p>${connections.map(p=>{const other=p.a.id===n.id?p.b:p.a;return `<button class="link-button" data-action="connect-with" data-id="${esc(other.id)}" style="white-space:normal;text-align:left">${I('arrow','icon small')} ${esc(short(other.body,65))}</button>`}).join('')}${notes.length>1?`<button class="btn outline tiny" data-action="find-links">발견하러 가기</button>`:''}</div>${links.length?`<div class="side-panel white"><h3>연결된 생각</h3>${links.map(x=>`<button class="link-button" data-action="detail" data-id="${esc(x.id)}">${I('link','icon small')} ${esc(short(x.body,34))}</button>`).join('')}</div>`:''}</aside></div>`}
const promptPool={flip:['반대로, 이 아이디어를 전혀 다른 사람에게 쓴다면?','가장 큰 제약 하나를 일부러 없애 본다면?','기존 방법과 정반대 방향으로 접근한다면?','돈이나 시간이 거의 없다면 무엇만 남길까?','내가 반대하는 사람이라면 무엇을 문제 삼을까?'],inspire:['지금 방식의 절반만 남기면 어떤 모습일까?','어떤 상황에서 이 생각이 특히 유용할까?','다른 분야에서 이미 해결한 비슷한 문제가 있을까?','가장 놀라운 사용 장면은 어떤 모습일까?','누가 보면 이 생각을 완전히 다르게 해석할까?']};
function nextPrompt(n,mode){const seen=Array.isArray(n.seen?.[mode])?n.seen[mode]:[];const arr=promptPool[mode]||[];return arr.find((p,i)=>!seen.includes(mode+'-'+i))||null}
function renderStudio(n){if(studio==='focus')return `<div class="work-panel"><h3>생각을 한 장으로.</h3><p class="help">모든 칸을 채울 필요 없어. 필요한 만큼만 적어 두면 다음에 이어갈 수 있어.</p><div class="focus-grid"><div><label class="field-label" for="f-who">누구를 위한 생각일까?</label><textarea class="form-textarea" id="f-who" placeholder="예: 생각은 많지만 정리하기 어려운 대학생">${esc(n.fields.who)}</textarea></div><div><label class="field-label" for="f-problem">어떤 불편을 덜어줄까?</label><textarea class="form-textarea" id="f-problem" placeholder="예: 기록하는 과정이 번거로워서 놓친다">${esc(n.fields.problem)}</textarea></div><div><label class="field-label" for="f-solution">핵심 해결 방법은?</label><textarea class="form-textarea" id="f-solution" placeholder="예: 메모 한 줄로 시작하는 아이디어 정원">${esc(n.fields.solution)}</textarea></div><div><label class="field-label" for="f-difference">기존 방법과 무엇이 다를까?</label><textarea class="form-textarea" id="f-difference" placeholder="예: 기록부터 실행까지 같은 곳에서 이어진다">${esc(n.fields.difference)}</textarea></div></div><div class="work-actions"><span class="tiny">원본 기록은 수정되지 않아.</span><span class="spacer"></span><button class="btn primary" data-action="focus-save">${I('check')} 내용 저장</button><button class="btn ghost" data-action="studio-close">닫기</button></div></div>`;
if(studio==='explore'){const mode=lens||'flip',p=nextPrompt(n,mode);return `<div class="work-panel"><h3>다른 방향으로 살펴보기.</h3><p class="help">여기는 정답을 찾는 곳이 아니야. 질문이 마음에 들지 않으면 건너뛰거나 자유롭게 적어도 돼.</p><div class="segments"><button class="segment ${mode==='flip'?'selected':''}" data-action="lens-mode" data-mode="flip">반대로 보기</button><button class="segment ${mode==='inspire'?'selected':''}" data-action="lens-mode" data-mode="inspire">가능성 넓히기</button></div><div style="margin-top:19px"><span class="eyebrow">${p?'TODAY’S SPARK':'NO MORE QUESTIONS'}</span><h3 style="margin:10px 0;font-size:18px;line-height:1.6">${esc(p||'준비된 질문은 여기까지야. 이제 네 생각을 이어가 봐.')}</h3></div><textarea id="explore-text" class="form-textarea" maxlength="14000" placeholder="질문과 상관없는 생각을 적어도 괜찮아."></textarea><div class="work-actions">${p?`<button class="btn outline" data-action="next-prompt">${I('shuffle')} 다른 질문</button>`:''}<span class="spacer"></span><button class="btn primary" data-action="explore-save">생각 남기기 ${I('plus')}</button><button class="btn ghost" data-action="studio-close">닫기</button></div></div>`}
if(studio==='free')return `<div class="work-panel"><h3>그냥, 이어서 써 줘.</h3><p class="help">정리되지 않은 문장도 괜찮아. 떠오른 걸 그대로 남기면 돼.</p><textarea id="free-text" class="form-textarea" maxlength="14000" placeholder="새로 알게 된 것, 바뀐 생각, 뜬금없는 연결까지."></textarea><div class="work-actions"><span class="spacer"></span><button class="btn primary" data-action="free-save">생각 붙이기 ${I('plus')}</button><button class="btn ghost" data-action="studio-close">닫기</button></div></div>`;
if(studio==='experiment')return `<div class="work-panel"><h3>작은 실험 하나면 충분해.</h3><p class="help">이론보다 빠른 검증을 해 봐. 실제로 했는지, 무엇을 배웠는지가 중요해.</p><div class="connection-grid">${['친구 세 명에게 실제로 필요한지 물어보기','비슷한 제품·방법 두 개를 찾아 비교하기','10분 안에 종이에 첫 화면 그려보기','가장 작은 첫 행동을 오늘 시도하기'].map(x=>`<button data-action="exp-template" data-value="${esc(x)}"><small>추천 실험</small>${esc(x)} ${I('arrow','icon small')}</button>`).join('')}</div><label class="field-label" for="exp-name">내 실험 직접 적기</label><input class="form-input" id="exp-name" placeholder="예: 일주일 동안 직접 써 보기" maxlength="300"/><div class="work-actions"><span class="spacer"></span><button class="btn primary" data-action="exp-save">실험 추가 ${I('plus')}</button><button class="btn ghost" data-action="studio-close">닫기</button></div></div>`;return ''}

function settings(){modal({title:'나의 기록 관리',body:`<div class="modal-section"><h3>기록 백업</h3><p>아이디어와 실험 결과를 JSON 파일로 저장할 수 있어. 다른 기기로 옮길 때도 이 파일을 사용할 수 있어.</p><button class="btn solid" data-action="backup">${I('download')} 백업 파일 저장</button><button class="btn outline" data-action="import">${I('upload')} 백업 불러오기</button></div><div class="modal-section"><h3>현재 저장 방식</h3><p>AI·계정·외부 데이터베이스 없이 작동해. 기록은 이 기기의 브라우저에만 저장돼. 다른 기기와 자동 동기화되지 않으며, 브라우저 데이터가 삭제되면 기록도 사라질 수 있어.</p><p>웹주소를 열어 사용할 수 있는 HTML 웹사이트야. GitHub Pages에는 데이터가 저장되지 않아.</p></div><div class="modal-section"><h3>무엇을 할 수 있나?</h3><p>생각 자동 조합은 한국어 단어 일치와 분야별 규칙에 기반해. 실제 의미 이해·AI 생성·온라인 공개 공유는 지원하지 않아.</p></div>`})}
function finishModal(){const n=note();modal({title:'오늘은 여기까지?',body:`<div class="modal-section" style="border:0;padding-top:8px"><p>가장 중요한 발견이나 다음에 기억할 한 줄을 남겨 봐. 다음에 다시 이어갈 수 있어.</p><textarea class="form-textarea" id="takeaway-input" maxlength="400" placeholder="오늘 발견한 한 문장">${esc(n.takeaway)}</textarea><div class="form-row"><button class="btn primary" data-action="takeaway-save">${I('bookmark')} 오늘의 결론 남기기</button></div></div>`})}
function expFinishModal(id){const n=note(),e=n.experiments.find(e=>e.id===id);if(!e)return;modal({title:'실험에서 무엇을 배웠어?',body:`<div class="modal-section" style="border:0;padding-top:8px"><p><strong>${esc(e.title)}</strong></p><div class="status-choice"><button data-action="result-pick" data-val="도움이 됐다" class="selected">도움이 됐다</button><button data-action="result-pick" data-val="예상과 달랐다">예상과 달랐다</button><button data-action="result-pick" data-val="판단이 어렵다">판단이 어렵다</button></div><label class="field-label" for="learning-text">배운 점 한 줄 (선택)</label><textarea id="learning-text" class="form-textarea" placeholder="실제로 해보니 어떤 점이 달랐어?"></textarea><div class="form-row"><button class="btn primary" data-action="result-save" data-id="${esc(id)}">${I('check')} 결과 기록</button></div></div>`});OVER.dataset.result='도움이 됐다'}
function noteText(n){return `처음의 생각 · ${day(n.created)}\n${n.body}\n\n`+Object.entries(n.fields).filter(([,v])=>v.trim()).map(([k,v])=>({who:'누구를 위해',problem:'어떤 문제',solution:'핵심 방법',difference:'차별점'}[k]||k)+': '+v).join('\n')+(n.entries.length?'\n\n이어진 생각\n'+n.entries.map(e=>`[${e.label}] ${e.body}`).join('\n'):'')+(n.experiments.length?'\n\n작은 실험\n'+n.experiments.map(e=>`${e.status==='done'?'✓':'○'} ${e.title}${e.learning?' — '+e.learning:''}`).join('\n'):'')+(n.takeaway?'\n\n지금의 결론\n'+n.takeaway:'')}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('클립보드에 복사했어.')}catch{const el=document.createElement('textarea');el.value=t;el.style.cssText='position:fixed;left:-9000px';document.body.append(el);el.select();if(document.execCommand('copy'))toast('복사했어.');else prompt('아래 내용을 복사해 줘',t);el.remove()}}
function backup(){const txt=JSON.stringify({app:'moru',version:10,notes,exportedAt:new Date().toISOString()},null,2),url=URL.createObjectURL(new Blob([txt],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='moru-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('백업 파일을 저장했어.')}
function maybeStartImport(){const input=$('import-file');input.value='';input.click()}
$('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>10e6)throw Error('파일이 너무 커.');const raw=JSON.parse(await file.text()),arr=Array.isArray(raw)?raw:raw.notes;if(!Array.isArray(arr))throw Error('올바른 기록 파일이 아니야.');const imported=arr.map(normalize).filter(Boolean);if(!confirm(`${imported.length}개 기록을 불러올까? 같은 ID의 기록은 중복되지 않아.`))return;let added=0;const success=transact(()=>{const ids=new Set(notes.map(n=>n.id));for(const n of imported){if(!ids.has(n.id)){notes.push(n);ids.add(n.id);added++}}});if(success){OVER.hidden=true;render();toast(`${added}개의 기록을 가져왔어.`)}}catch(err){toast('가져오기 실패: '+err.message)}});
const takeText=(id)=>$(id)?.value.trim()||'';
function action(name,button){const id=button?.dataset.id,cur=note();switch(name){case 'nav':savedId=null;pairOverride=null;pairIndex=0;jump(button.dataset.screen);break;case 'detail':jump('detail',id);break;case 'settings':settings();break;case 'close-modal':OVER.hidden=true;OVER.innerHTML='';break;
case 'play-tab':playMode=button.dataset.mode;playSavedId=null;pairOverride=null;pairIndex=0;render();break;
case 'play-next':playStep++;playSavedId=null;render();break;
case 'play-save':{const v=takeText('play-answer');if(!v){toast('떠오른 생각을 한 줄 적어 봐.');return}const ch=playChallenge(),n=normalize({id:uid(),body:v,created:Date.now(),entries:[{id:uid(),body:ch.a?`${ch.a} × ${ch.b}`:ch.prompt,label:ch.a?'발명 놀이터에서 시작':'관찰 놀이터에서 시작',type:'play',created:Date.now()}]});if(transact(()=>notes.unshift(n))){playSavedId=n.id;playStep++;render();toast('새로운 생각을 심었어.')}}break;
case 'lab-finish':activeId=button.dataset.note;expFinishModal(id);break;
case 'lab-pick':jump('garden');toast('실험할 생각 하나를 열어 봐.');break;
case 'lab-new':jump('detail',id);studio='experiment';render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'center'});break;
case 'capture-save':{const value=takeText('capture-input');if(!value)return;const n=normalize({id:uid(),body:value,created:Date.now()});if(transact(()=>notes.unshift(n))){put(DRAFT,'');savedId=n.id;render();const s=$('capture-feedback');s?.scrollIntoView({behavior:'smooth',block:'nearest'});toast('생각을 남겼어.')}}break;
case 'open-saved':if(savedId)jump('detail',savedId);break;
case 'filter':filter=button.dataset.filter;render();break;
case 'favorite':if(!cur)return;if(transact(()=>cur.favorite=!cur.favorite)){render();toast(cur.favorite?'아껴둔 생각에 추가했어.':'아껴둔 생각에서 뺐어.')}break;
case 'edit-note':if(!cur)return;modal({title:'처음의 생각 수정',body:`<div class="modal-section" style="border:0;padding-top:8px"><p>이어 쓴 생각은 그대로 남아.</p><textarea class="form-textarea" id="edit-body" style="min-height:175px" maxlength="14000">${esc(cur.body)}</textarea><div class="form-row"><button class="btn primary" data-action="edit-save">수정 저장</button></div></div>`});break;
case 'edit-save':{const v=takeText('edit-body');if(!v){toast('내용을 입력해 줘.');return}if(transact(()=>{cur.body=v;cur.updated=Date.now()})){OVER.hidden=true;render();toast('수정했어.')}}break;
case 'delete-note':if(!confirm('이 기록과 이어진 생각, 실험을 모두 삭제할까?'))return;if(transact(()=>{notes=notes.filter(x=>x.id!==cur.id);for(const n of notes)n.links=n.links.filter(x=>x!==cur.id)})){jump('garden');toast('기록을 삭제했어.')}break;
case 'share-note':if(!cur)return;{const text=noteText(cur);if(navigator.share){navigator.share({title:'Moru에서 자란 생각',text}).catch(()=>{});}else copy(text)}break;
case 'studio':studio=button.dataset.studio;lens=null;render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'center'});break;
case 'studio-close':studio=null;lens=null;render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'focus-save':{if(!cur)return;const fields={who:takeText('f-who'),problem:takeText('f-problem'),solution:takeText('f-solution'),difference:takeText('f-difference')};if(transact(()=>{cur.fields=fields;cur.updated=Date.now()})){studio=null;render();toast('생각이 조금 더 또렷해졌어.')}}break;
case 'lens-mode':lens=button.dataset.mode;render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'center'});break;
case 'next-prompt':{const mode=lens||'flip',p=nextPrompt(cur,mode);if(p)transact(()=>{cur.seen[mode]=Array.isArray(cur.seen[mode])?cur.seen[mode]:[];cur.seen[mode].push(mode+'-'+promptPool[mode].indexOf(p))});render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'center'});break}
case 'explore-save':{const v=takeText('explore-text'),mode=lens||'flip',p=nextPrompt(cur,mode);if(!v){toast('한 줄만 남겨도 괜찮아.');return}if(transact(()=>{cur.entries.push({id:uid(),body:v,type:mode,label:mode==='flip'?'뒤집어 본 생각':'가능성을 넓힌 생각',prompt:p,created:Date.now(),linkId:null});if(p){cur.seen[mode]=cur.seen[mode]||[];cur.seen[mode].push(mode+'-'+promptPool[mode].indexOf(p))}cur.updated=Date.now()})){studio=null;render();toast('새로운 가지를 남겼어.')}}break;
case 'free-save':{const v=takeText('free-text');if(!v){toast('남길 생각을 입력해 줘.');return}if(transact(()=>{cur.entries.push({id:uid(),body:v,type:'free',label:'이어진 생각',created:Date.now(),linkId:null});cur.updated=Date.now()})){studio=null;render();toast('생각을 이어 붙였어.')}}break;
case 'new-exp':studio='experiment';render();$('studio-section')?.scrollIntoView({behavior:'smooth',block:'center'});break;
case 'exp-template':$('exp-name').value=button.dataset.value;$('exp-name').focus();break;
case 'exp-save':{const v=takeText('exp-name');if(!v){toast('실험을 한 문장으로 적어 줘.');return}if(transact(()=>{cur.experiments.unshift({id:uid(),title:v,status:'todo',result:'',learning:'',created:Date.now(),doneAt:null});cur.updated=Date.now()})){studio=null;render();toast('작은 실험이 생겼어.')}}break;
case 'finish-exp':expFinishModal(id);break;
case 'result-pick':OVER.dataset.result=button.dataset.val;OVER.querySelectorAll('[data-action="result-pick"]').forEach(b=>b.classList.toggle('selected',b===button));break;
case 'result-save':{const e=cur?.experiments.find(x=>x.id===id);if(!e)return;const v=OVER.dataset.result||'도움이 됐다',learning=takeText('learning-text');if(transact(()=>{e.status='done';e.result=v;e.learning=learning;e.doneAt=Date.now();cur.updated=Date.now()})){OVER.hidden=true;render();toast('작은 실험을 마쳤어. 배움이 남았네.')}}break;
case 'remove-exp':if(!confirm('실험 기록을 삭제할까?'))return;if(transact(()=>{cur.experiments=cur.experiments.filter(e=>e.id!==id);cur.updated=Date.now()})){render();toast('실험을 삭제했어.')}break;
case 'remove-entry':if(!confirm('이어서 쓴 생각을 삭제할까?'))return;if(transact(()=>{cur.entries=cur.entries.filter(e=>e.id!==id);cur.updated=Date.now()})){render();toast('삭제했어.')}break;
case 'copy-summary':if(cur)copy(noteText(cur));break;
case 'finish-note':finishModal();break;
case 'takeaway-save':if(transact(()=>{cur.takeaway=takeText('takeaway-input');cur.closedAt=Date.now();cur.updated=Date.now()})){OVER.hidden=true;render();toast('오늘의 생각을 잘 남겨 뒀어.')}break;
case 'find-links':playMode='connect';pairOverride=null;pairMode='similar';pairIndex=0;jump('playground');break;
case 'connect-with':if(cur){playMode='connect';pairOverride=[cur.id,id];pairIndex=0;jump('playground')}break;
case 'pair-mode':pairMode=button.dataset.mode;pairIndex=0;pairOverride=null;render();break;
case 'pair-next':pairIndex++;pairOverride=null;render();break;
case 'create-link-idea':{const p=pairList()[pairIndex%pairList().length],v=takeText('discover-text');if(!v){toast('새로운 생각을 한 줄 적어 줘.');return}if(!p)return;const n=normalize({id:uid(),body:v,created:Date.now(),links:[p.a.id,p.b.id]});if(transact(()=>{notes.unshift(n);p.a.links=[...new Set([...(p.a.links||[]),n.id])];p.b.links=[...new Set([...(p.b.links||[]),n.id])] })){jump('detail',n.id);toast('두 생각 사이에서 새 아이디어가 태어났어.')}}break;
case 'backup':backup();break;case 'import':maybeStartImport();break;
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b);});
document.addEventListener('input',e=>{if(e.target.id==='capture-input'){put(DRAFT,e.target.value);$('capture-save').disabled=!e.target.value.trim();if(savedId){savedId=null;$('capture-feedback').innerHTML=''}}if(e.target.id==='search-input'){search=e.target.value;const arr=notes.filter(n=>(n.body+' '+n.entries.map(e=>e.body).join(' ')+' '+Object.values(n.fields).join(' ')).toLowerCase().includes(search.toLowerCase())).filter(n=>filter==='all'||filter==='favorite'&&n.favorite||filter==='active'&&n.experiments.some(e=>e.status==='todo')||filter==='flower'&&complete(n)>0).sort((a,b)=>b.updated-a.updated);$('garden-cards').innerHTML=cards(arr)}});
OVER.addEventListener('click',e=>{if(e.target===OVER){OVER.hidden=true;OVER.innerHTML=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!OVER.hidden){OVER.hidden=true;OVER.innerHTML=''}});
$('brand').addEventListener('click',()=>jump('capture'));
init();render();
})();

</script>

</body></html>
