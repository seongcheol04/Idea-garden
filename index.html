<title>moru. — 생각을 남기고, 키우다</title>
<style>
:root{--bg:#f8f8f3;--paper:#fff;--ink:#293b30;--sub:#6b786e;--quiet:#929e95;--green:#53745b;--green-deep:#415f49;--pale:#e9f0e7;--line:#e4eae1;--shadow:0 18px 52px rgba(37,67,44,.055);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a8bda9;outline-offset:3px}a{color:inherit}.app{max-width:580px;padding:0 23px 80px;margin:auto;min-height:100dvh}.top{height:96px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:-1.9px;color:var(--green-deep);font-weight:700;font-size:34px;line-height:1}.brand span{color:#b9cdb8}.headlink{display:inline-flex;align-items:center;gap:7px;color:var(--sub);font-size:13px;font-weight:600;background:transparent;border:0;padding:12px 0}.headlink .count{min-width:22px;display:inline-grid;place-items:center;height:22px;background:#e9efe6;border-radius:15px;color:var(--green);font-size:11px;padding:0 6px}.view{animation:appear .28s ease both}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.eyebrow{text-transform:none;font-size:12px;letter-spacing:.06em;font-weight:650;color:var(--green)}.hero{padding-top:78px}.hero-title{font-size:clamp(31px,7.4vw,39px);letter-spacing:-1.65px;font-weight:650;line-height:1.35;margin:16px 0 13px}.hero-lead{font-size:14px;line-height:1.8;color:var(--sub);margin:0 0 33px}.editor{background:var(--paper);border:1px solid #e7ece5;border-radius:21px;box-shadow:var(--shadow);padding:20px 20px 16px;transition:border-color .25s,box-shadow .25s}.editor:focus-within{border-color:#b6c8b4;box-shadow:0 18px 50px rgba(57,99,66,.09)}.editor textarea,.plainarea{display:block;width:100%;border:0;outline:none!important;outline-offset:0;resize:vertical;background:transparent;color:var(--ink);line-height:1.78;font-size:16px;min-height:148px;padding:0}.editor textarea::placeholder,.plainarea::placeholder{color:#a6b0a7}.editor-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.smallhint{font-size:11px;color:#9ba89e;line-height:1.5}.btn{border:0;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;line-height:1.25;min-height:44px;padding:12px 17px;transition:background .18s,transform .18s,border-color .18s}.btn:active:not(:disabled){transform:scale(.98)}.btn svg{width:16px;height:16px;flex-shrink:0}.primary{background:var(--green);color:white}.primary:hover:not(:disabled){background:var(--green-deep)}.secondary{background:white;color:var(--green-deep);border:1px solid #dce5d9}.secondary:hover{background:#f2f6f0}.ghost{background:transparent;color:var(--sub);padding-left:5px;padding-right:5px}.btn-wide{width:100%}.notefoot{color:#a1aaa3;font-size:12px;margin:22px 0 0;text-align:center;line-height:1.7}.save-feedback{display:none;align-items:center;justify-content:space-between;gap:12px;border:1px solid #d9e9d7;border-radius:14px;background:#edf5eb;color:#476a4d;margin-top:17px;padding:13px 14px;animation:popin .35s cubic-bezier(.18,.8,.28,1.2)}.save-feedback.show{display:flex}.save-feedback .good{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650}.save-feedback .tick{height:23px;width:23px;display:grid;place-items:center;border-radius:100%;background:#75977b;color:#fff;animation:checkpop .46s ease both}.save-feedback .tick svg{width:15px;height:15px}.save-feedback button{border:0;background:transparent;color:#476a4d;font-size:12px;font-weight:700;padding:4px;white-space:nowrap}@keyframes popin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes checkpop{0%{transform:scale(.3)}65%{transform:scale(1.22)}100%{transform:scale(1)}}.pagehead{margin:28px 0 27px}.pagehead h1{font-weight:650;font-size:30px;letter-spacing:-1px;line-height:1.35;margin:10px 0}.pagehead .subtitle{font-size:14px;line-height:1.8;color:var(--sub);margin:10px 0 0}.back{display:inline-flex;align-items:center;gap:7px;color:var(--sub);font-size:13px;font-weight:600;border:0;background:transparent;padding:12px 0}.back svg{height:17px;width:17px}.stack{display:grid;gap:12px}.note{display:block;width:100%;text-align:left;background:white;border:1px solid #e8ece6;border-radius:17px;padding:19px 19px 17px;box-shadow:0 4px 18px rgba(45,66,48,.025);transition:transform .16s,border-color .16s}.note:hover{transform:translateY(-2px);border-color:#cad8c9}.notetop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--quiet)}.note-body{font-size:15px;font-weight:520;line-height:1.75;color:var(--ink);word-break:break-word;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.note-bottom{display:flex;align-items:center;gap:6px;margin-top:13px;color:var(--green);font-size:12px}.dot{width:5px;height:5px;background:#9db59d;border-radius:50%}.search{height:47px;width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 15px;margin-bottom:20px;font-size:14px;color:var(--ink)}.search::placeholder{color:#a2aca3}.empty{padding:65px 18px;text-align:center;color:var(--quiet);font-size:14px;line-height:1.85}.library-bottom{display:flex;align-items:center;justify-content:center;gap:18px;margin:42px 0 16px}.library-bottom button{background:none;border:0;padding:8px 2px;font-size:12px;color:var(--quiet)}.original{background:white;border:1px solid var(--line);border-radius:19px;padding:23px 22px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);font-size:17px;line-height:1.85}.original .date{display:block;color:var(--quiet);font-size:12px;margin-bottom:17px;line-height:1.5}.actioncard{background:var(--pale);border:1px solid #dfebdc;border-radius:19px;padding:22px 20px;margin-top:21px}.actioncard h2{font-size:18px;margin:0 0 8px;font-weight:650;letter-spacing:-.3px}.actioncard p{font-size:13px;line-height:1.8;color:#738676;margin:0 0 19px}.actioncard .btn{width:100%;min-height:49px}.sectiontitle{font-size:14px;color:var(--green-deep);font-weight:700;letter-spacing:-.2px;margin:35px 0 17px}.growthline{position:relative;margin-left:10px;padding:0 0 23px 25px;border-left:1.5px solid #d9e5d7}.growthline:last-child{border-left-color:transparent;padding-bottom:7px}.growthline:before{content:'';position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;background:#a6bea7}.growthline small{font-size:12px;color:var(--quiet)}.growthline .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px;font-size:14px;line-height:1.8}.textaction{background:none;border:0;color:var(--green);font-size:13px;font-weight:650;padding:12px 0}.details-bottom{display:flex;align-items:center;justify-content:space-between;margin:33px 0}.details-bottom .danger{color:#ad7979}.floating-form{background:white;padding:17px;border-radius:16px;border:1px solid var(--line);margin-top:15px;box-shadow:var(--shadow)}.floating-form textarea{min-height:98px}.floating-form .editor-actions{margin-top:8px}.trackintro{padding-top:8px}.trackoption{width:100%;text-align:left;display:flex;align-items:center;gap:16px;background:white;border:1px solid var(--line);border-radius:19px;padding:20px 19px;margin:0 0 12px;transition:border-color .18s,transform .18s}.trackoption:hover{border-color:#b8ccb8;transform:translateY(-1px)}.trackicon{flex:none;width:45px;height:45px;border-radius:14px;background:#edf3eb;color:var(--green);display:grid;place-items:center}.trackicon svg{height:21px;width:21px}.trackoption .inner{flex:1}.trackoption strong{font-size:15px;display:block;letter-spacing:-.2px;margin-bottom:5px}.trackoption small{font-size:12px;color:var(--sub);line-height:1.55;display:block}.trackoption .arrow{color:#9aaa9e}.trackoption .arrow svg{width:17px;height:17px}.mini-origin{border-left:2px solid #b7cdb7;margin:20px 0 31px;padding:3px 0 3px 15px;color:#6b7d6f;font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.stepbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:35px 0 13px}.stepbar .stepname{font-size:12px;color:var(--green);font-weight:700}.stepbar .counter{font-size:12px;color:var(--quiet);font-variant-numeric:tabular-nums}.steps{display:flex;gap:6px}.step{height:4px;flex:1;border-radius:4px;background:#e5ebe2;transition:background .25s}.step.done{background:#91b199}.step.active{background:#587961}.questioncard{padding-top:23px}.questioncard h2{font-size:clamp(24px,6vw,30px);letter-spacing:-1px;font-weight:650;line-height:1.5;margin:0 0 12px}.questioncard p{font-size:14px;color:var(--sub);line-height:1.8;margin:0 0 27px}.questioncard .editor textarea{min-height:126px}.belowtools{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.belowtools button{font-size:13px;padding:8px 0;background:none;border:0;color:var(--sub)}.belowtools .finish{color:var(--green);font-weight:650}.complete{padding-top:21px}.complete-emblem{width:60px;height:60px;display:grid;place-items:center;border-radius:20px;background:var(--pale);color:var(--green);margin-bottom:22px;animation:popin .48s ease}.complete-emblem svg{width:29px;height:29px}.complete h1{font-size:28px;line-height:1.4;letter-spacing:-.9px;margin:0 0 9px}.complete-lead{font-size:14px;color:var(--sub);line-height:1.8;margin:0 0 28px}.summary-item{padding:17px 0;border-top:1px solid var(--line)}.summary-item .q{color:var(--green);font-size:12px;font-weight:650;line-height:1.6}.summary-item .a{font-size:14px;line-height:1.85;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}.summary-item .unanswered{font-size:13px;color:#a7afa7}.complete-actions{display:grid;gap:10px;margin:24px 0}.finishhint{margin-top:18px;font-size:12px;line-height:1.75;color:var(--quiet)}.toast-layer{position:fixed;z-index:1000;top:18px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 40px);pointer-events:none}.toast{display:flex;align-items:center;gap:9px;box-shadow:0 13px 45px #1c302735;background:#344e3a;color:white;border-radius:50px;padding:13px 18px;font-size:13px;font-weight:650;animation:toastin .28s ease both}.toast svg{width:16px;height:16px;color:#bddbbc}@keyframes toastin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:800px){.hero{padding-top:105px}}@media(max-width:400px){.app{padding:0 17px 70px}.top{height:80px}.hero{padding-top:51px}.hero-title{font-size:31px}.editor{padding:17px}.pagehead h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
<main class="app"><header class="top"><div class="brand" aria-label="moru">moru<span>.</span></div><div id="nav"></div></header><div id="root"></div></main>
<div id="toast-layer" class="toast-layer" role="status" aria-live="polite"></div>
<input type="file" id="restore-input" accept=".json,application/json" class="sr-only" aria-label="기록 백업 파일 불러오기">
<script>
(()=>{
'use strict';
const KEY='moru_v7_data',OLD='moru_v6_notes',DRAFT='moru_v7_capture_draft',GROW_DRAFT='moru_v7_grow_draft_';
const tracks={
  expand:{name:'생각 넓히기',sub:'새로운 관점을 찾아보는 다섯 가지 질문',steps:[
    {id:'spark',label:'시작',q:'처음 이 생각이 떠오른 순간은 언제였어?',hint:'아주 사소한 경험이나 장면이어도 좋아.'},
    {id:'reverse',label:'반전',q:'당연하다고 생각한 조건을 뒤집으면 어떨까?',hint:'지금의 방식과 완전히 반대로 상상해 봐.'},
    {id:'connect',label:'연결',q:'전혀 다른 분야와 연결한다면?',hint:'다른 제품, 사람, 장소와 결합해도 좋아.'},
    {id:'focus',label:'핵심',q:'이 생각에서 단 한 가지만 남긴다면?',hint:'핵심이 무엇인지 더 분명하게 만들어 봐.'},
    {id:'future',label:'다음',q:'이 생각이 한 단계 자란 모습은 어떨까?',hint:'아직 실현 가능성은 잠시 잊어도 괜찮아.'}
  ]},
  build:{name:'현실로 만들기',sub:'실제로 시도하기 위한 다섯 가지 질문',steps:[
    {id:'problem',label:'문제',q:'이 생각이 해결하려는 불편은 무엇일까?',hint:'누군가 실제로 겪는 상황으로 표현해 봐.'},
    {id:'people',label:'사람',q:'이걸 가장 먼저 필요로 할 사람은 누구일까?',hint:'가능하면 한 사람을 구체적으로 떠올려 봐.'},
    {id:'method',label:'방법',q:'그 문제를 해결하는 가장 간단한 방법은?',hint:'처음부터 완벽하게 만들 필요는 없어.'},
    {id:'difference',label:'차이',q:'기존의 방법과 비교해 무엇이 달라질까?',hint:'차별점이 떠오르지 않으면 건너뛰어도 돼.'},
    {id:'test',label:'실험',q:'이 생각이 통하는지 작게 확인할 방법은?',hint:'사람 한 명에게 보여주거나 간단히 시험해 봐도 좋아.'}
  ]}
};
const root=document.getElementById('root'),nav=document.getElementById('nav'),toastLayer=document.getElementById('toast-layer');
let notes=[],screen='capture',active=null,track=null,showAdd=false,lastSaved=null,searchValue='',toastTimeout=null,storeWarning=false;
const icons={arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',left:'<path d="m15 18-6-6 6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',leaf:'<path d="M20 4c-8 0-14 3-14 11a5 5 0 0 0 5 5c8 0 11-6 9-16Z"/><path d="M4 21c3-5 7-8 12-11"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',chevron:'<path d="m9 18 6-6-6-6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',pencil:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/>',circle:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'};
const svg=(type)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.75');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');s.innerHTML=icons[type]||icons.arrow;return s};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function button(text,cls,fn,iconName,iconAtEnd=false){const e=el('button',cls);e.type='button';if(iconName&&!iconAtEnd)e.append(svg(iconName));e.append(document.createTextNode(text));if(iconName&&iconAtEnd)e.append(svg(iconName));e.addEventListener('click',fn);return e}
function append(parent,...kids){kids.forEach(k=>parent.append(k));return parent}
function toast(message){clearTimeout(toastTimeout);toastLayer.replaceChildren();const t=el('div','toast');append(t,svg('check'),document.createTextNode(message));toastLayer.append(t);toastTimeout=setTimeout(()=>{if(t.isConnected)t.remove()},2600)}
function timestamp(t){const d=new Date(t||Date.now());return Number.isFinite(d.getTime())?d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'이전 기록'}
function relative(t){const diff=Date.now()-(t||0);if(diff>=0&&diff<60000)return '방금';if(diff>=0&&diff<3600000)return `${Math.floor(diff/60000)}분 전`;if(diff>=0&&diff<86400000)return `${Math.floor(diff/3600000)}시간 전`;return timestamp(t)}
function uid(){return globalThis.crypto&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'m'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function readLocal(k){try{return localStorage.getItem(k)}catch(e){return null}}
function writeLocal(k,v){try{localStorage.setItem(k,v);return true}catch(e){storeWarning=true;return false}}
function eraseLocal(k){try{localStorage.removeItem(k)}catch(e){}}
function cleanTrack(t){return {visited:Array.isArray(t?.visited)?t.visited.filter(v=>typeof v==='string'):[],answers:t&&typeof t.answers==='object'&&!Array.isArray(t.answers)?t.answers:{},finished:!!t?.finished}}
function cleanNote(n){if(!n||typeof n.body!=='string'||!n.body.trim())return null;const oldGrowth=Array.isArray(n.growth)?n.growth:[];let entries=Array.isArray(n.entries)?n.entries.filter(x=>x&&typeof x.body==='string').map(x=>({id:typeof x.id==='string'?x.id:uid(),body:x.body,created:Number(x.created)||Date.now(),label:typeof x.label==='string'?x.label:'추가한 생각'})):oldGrowth.filter(x=>x&&typeof x.body==='string').map(x=>({id:uid(),body:x.body,created:Number(x.created)||Number(n.created)||Date.now(),label:typeof x.question==='string'&&x.question?x.question:'이어 쓴 생각'}));
const t={expand:cleanTrack(n.tracks?.expand),build:cleanTrack(n.tracks?.build)};
if(!n.tracks&&oldGrowth.length){const oldMap={origin:['expand','spark'],alternative:['expand','reverse'],problem:['build','problem'],people:['build','people'],core:['build','method'],difference:['build','difference'],test:['build','test']};oldGrowth.forEach(g=>{const m=oldMap[g.qid];if(!m||typeof g.body!=='string')return;const s=t[m[0]];if(!s.visited.includes(m[1]))s.visited.push(m[1]);s.answers[m[1]]=g.body});(Array.isArray(n.skipped)?n.skipped:[]).forEach(id=>{const m=oldMap[id];if(m&&!t[m[0]].visited.includes(m[1]))t[m[0]].visited.push(m[1])})}
return {id:String(n.id||uid()),body:n.body,created:Number(n.created)||Date.now(),updated:Number(n.updated)||Number(n.created)||Date.now(),entries,tracks:t}}
function bootstrap(){let raw=readLocal(KEY);if(raw){try{const data=JSON.parse(raw);notes=(Array.isArray(data)?data:data.notes||[]).map(cleanNote).filter(Boolean);return}catch(e){storeWarning=true}}
const older=readLocal(OLD);if(older){try{notes=JSON.parse(older).map(cleanNote).filter(Boolean);writeLocal(KEY,JSON.stringify({version:7,notes}));return}catch(e){storeWarning=true}}
notes=[]}
function persist(){return writeLocal(KEY,JSON.stringify({version:7,notes}))}
function updateNote(n,mutate){const snapshot=JSON.stringify(n);mutate(n);n.updated=Date.now();if(!persist()){Object.assign(n,JSON.parse(snapshot));alert('저장하지 못했어. 저장 공간 또는 브라우저 설정을 확인해 줘.');return false}return true}
function current(){return notes.find(n=>n.id===active)}
function setNav(label,fn,count){nav.replaceChildren();const b=button(label,'headlink',fn);if(count!==undefined)b.append(el('span','count',String(count)));nav.append(b)}
function page(title,subtitle){const p=el('div','pagehead');append(p,el('h1','',title));if(subtitle)p.append(el('p','subtitle',subtitle));return p}
function back(text,fn){return button(text,'back',fn,'left')}
function show(screenName,id){screen=screenName;if(id!==undefined)active=id;showAdd=false;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){root.replaceChildren();root.className='view';if(screen==='capture')capture();else if(screen==='library')library();else if(screen==='detail')detail();else if(screen==='choose')choose();else if(screen==='question')question();else if(screen==='complete')complete()}
function capture(){setNav('기록 보기',()=>show('library'),notes.length);const hero=el('section','hero');append(hero,el('div','eyebrow','생각을 남기는 가장 쉬운 방법'),el('h1','hero-title','떠오른 생각을,\n그대로.'),el('p','hero-lead','아직 정리하지 않아도 괜찮아.\n지금은 기록하는 것만으로 충분해.'));
hero.querySelector('h1').style.whiteSpace='pre-line';hero.querySelector('.hero-lead').style.whiteSpace='pre-line';
const card=el('div','editor'),area=el('textarea');area.placeholder='지금 무슨 생각이 떠올랐어?';area.setAttribute('aria-label','새 생각 기록');area.value=readLocal(DRAFT)||'';
const row=el('div','editor-actions'),hint=el('span','smallhint','입력 중에도 임시 저장돼요'),save=button('기록하기','btn primary',()=>{
 const body=area.value.trim();if(!body)return;const n=cleanNote({id:uid(),body,created:Date.now(),entries:[],tracks:{}});notes.unshift(n);if(!persist()){notes.shift();alert('기록을 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.');return}eraseLocal(DRAFT);area.value='';save.disabled=true;lastSaved=n.id;feedback.classList.add('show');feedback.querySelector('.tick').replaceWith(createTick());setNav('기록 보기',()=>show('library'),notes.length);toast('기록이 저장됐어');area.focus();
},'arrow',true);save.disabled=!area.value.trim();area.addEventListener('input',()=>{save.disabled=!area.value.trim();writeLocal(DRAFT,area.value);feedback.classList.remove('show')});area.addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'&&!save.disabled){ev.preventDefault();save.click()}});append(row,hint,save);append(card,area,row);
const feedback=el('div','save-feedback');const good=el('span','good');append(good,createTick(),document.createTextNode('기록됐어. 언제든 꺼내볼 수 있어.'));append(feedback,good,button('방금 기록 보기','',()=>show('detail',lastSaved),'arrow',true));
append(hero,card,feedback,el('p','notefoot','생각은 내 기기의 브라우저에 저장돼요.'));if(storeWarning)hero.append(el('p','notefoot','저장소를 읽는 중 오류가 있었어. 중요한 기록은 백업해 줘.'));root.append(hero)}
function createTick(){const t=el('span','tick');t.append(svg('check'));return t}
function library(){setNav('＋ 새 기록',()=>show('capture'));append(root,page('남겨둔 생각들',notes.length?`${notes.length}개의 생각을 간직하고 있어.`:'첫 번째 생각을 남겨볼까?'));
if(!notes.length){const e=el('div','empty');append(e,el('p','', '아직 기록이 없어.'),button('첫 생각 기록하기','btn primary',()=>show('capture')));root.append(e);return}
const input=el('input','search');input.type='search';input.placeholder='기록 검색';input.setAttribute('aria-label','기록 검색');input.value=searchValue;const stack=el('div','stack');function filter(){searchValue=input.value;stack.replaceChildren();const filtered=notes.filter(n=>(n.body+' '+n.entries.map(e=>e.body).join(' ')).toLocaleLowerCase().includes(searchValue.toLocaleLowerCase())).sort((a,b)=>b.created-a.created);if(!filtered.length){stack.append(el('div','empty','일치하는 기록이 없어.'));return}filtered.forEach(n=>{const b=el('button','note');b.type='button';const top=el('div','notetop');append(top,el('span','',relative(n.created)),el('span','',n.tracks.expand.finished||n.tracks.build.finished?'발전 기록 있음':n.entries.length?'생각을 이어가는 중':'빠른 기록'));append(b,top,el('div','note-body',n.body));if(n.entries.length){const sub=el('div','note-bottom');append(sub,el('span','dot'),document.createTextNode(`이어진 생각 ${n.entries.length}개`));b.append(sub)}b.addEventListener('click',()=>show('detail',n.id));stack.append(b)})}input.addEventListener('input',filter);filter();append(root,input,stack);
const foot=el('div','library-bottom');append(foot,button('기록 백업','',backup),button('백업 불러오기','',()=>document.getElementById('restore-input').click()));root.append(foot)}
function detail(){const n=current();if(!n){show('library');return}setNav('새 기록 ＋',()=>show('capture'));append(root,back('모든 기록',()=>show('library')));const head=page('기록한 생각','처음 남긴 내용은 그대로 보존돼.');head.style.marginTop='6px';root.append(head);
const original=el('article','original');append(original,el('span','date',timestamp(n.created)),document.createTextNode(n.body));root.append(original);
const card=el('section','actioncard');append(card,el('h2','',n.entries.length?'이 생각을 더 키워볼까?':'이 생각을 발전시켜볼까?'),el('p','', '원할 때만 질문을 따라가면 돼. 다섯 가지를 살펴보면 스스로 마무리할 수 있어.'),button(n.entries.length?'생각 계속 발전시키기':'생각 발전시키기','btn primary',()=>show('choose'),'arrow',true));root.append(card);
const label=el('h2','sectiontitle','이어진 생각');root.append(label);
if(!n.entries.length)root.append(el('p','smallhint','아직 추가된 생각이 없어. 처음의 생각부터 간직하고 있어.'));
else{const timeline=el('div');n.entries.slice().sort((a,b)=>a.created-b.created).forEach(x=>{const item=el('div','growthline');append(item,el('small','',x.label+' · '+relative(x.created)),el('div','body',x.body));timeline.append(item)});root.append(timeline)}
root.append(button(showAdd?'닫기':'+ 자유롭게 생각 덧붙이기','textaction',()=>{showAdd=!showAdd;render();if(showAdd)root.querySelector('.floating-form textarea')?.focus()}));
if(showAdd){const form=el('div','floating-form'),ta=el('textarea','plainarea');ta.placeholder='이 생각에 이어서 떠오르는 걸 적어봐.';const draftKey=GROW_DRAFT+n.id;ta.value=readLocal(draftKey)||'';const row=el('div','editor-actions'),cancel=button('취소','btn ghost',()=>{showAdd=false;render()}),submit=button('생각 남기기','btn primary',()=>{const body=ta.value.trim();if(!body)return;if(updateNote(n,x=>x.entries.push({id:uid(),body,created:Date.now(),label:'자유롭게 덧붙이기'}))){eraseLocal(draftKey);showAdd=false;render();toast('새로운 생각을 이어 붙였어')}});submit.disabled=!ta.value.trim();ta.addEventListener('input',()=>{submit.disabled=!ta.value.trim();writeLocal(draftKey,ta.value)});append(row,cancel,submit);append(form,ta,row);root.append(form)}
const bottom=el('div','details-bottom');append(bottom,button('내용 복사','btn ghost',()=>copyText(noteText(n)),'copy'),button('삭제','btn ghost danger',()=>{if(!confirm('이 기록과 발전한 생각을 모두 삭제할까? 이 작업은 되돌릴 수 없어.'))return;const previous=notes;notes=notes.filter(x=>x.id!==n.id);if(!persist()){notes=previous;alert('삭제 내용을 저장하지 못했어.');return}show('library');toast('기록을 삭제했어')}));root.append(bottom)}
function choose(){const n=current();if(!n){show('library');return}setNav('기록 보기',()=>show('detail'));append(root,back('기록으로',()=>show('detail')),page('어떤 방향으로 키워볼까?','질문은 내가 선택한 순간에만 시작돼. 원할 때 언제든 끝낼 수 있어.'),el('div','mini-origin',n.body));
['expand','build'].forEach(name=>{const conf=tracks[name],t=n.tracks[name],visited=t.visited.length;const b=el('button','trackoption');b.type='button';const icon=el('span','trackicon');icon.append(svg(name==='expand'?'leaf':'target'));const content=el('span','inner');append(content,el('strong','',conf.name),el('small','',t.finished?`이번 탐색 마무리 · ${Object.keys(t.answers).length}개 기록`:visited?`${visited}/5 살펴봄 · 이어서 할 수 있어`:conf.sub));const arrow=el('span','arrow');arrow.append(svg('chevron'));append(b,icon,content,arrow);b.addEventListener('click',()=>{track=name;show(t.finished||t.visited.length>=conf.steps.length?'complete':'question')});root.append(b)})
root.append(el('p','finishhint','두 방향을 모두 할 필요는 없어. 생각을 기록하는 것만으로도 충분해.'))}
function stepNext(n,name){const visited=new Set(n.tracks[name].visited);return tracks[name].steps.find(s=>!visited.has(s.id))||null}
function question(){const n=current();if(!n||!tracks[track]){show('choose');return}const conf=tracks[track],state=n.tracks[track];if(state.finished||!stepNext(n,track)){show('complete');return}const step=stepNext(n,track),idx=conf.steps.findIndex(s=>s.id===step.id);setNav('그만하고 돌아가기',()=>show('detail'));append(root,back('발전 방향',()=>show('choose')),el('div','mini-origin',n.body));const bar=el('div','stepbar');append(bar,el('span','stepname',conf.name),el('span','counter',`${idx+1} / ${conf.steps.length}`));const bars=el('div','steps');conf.steps.forEach((x,i)=>bars.append(el('span','step'+(state.visited.includes(x.id)?' done':i===idx?' active':''))));root.append(bar,bars);
const qc=el('section','questioncard');append(qc,el('div','eyebrow',step.label),el('h2','',step.q),el('p','',step.hint));const editor=el('div','editor'),area=el('textarea');area.placeholder='떠오르는 생각을 편하게 적어봐.';area.setAttribute('aria-label','질문에 대한 생각');const draftKey=GROW_DRAFT+n.id+'_'+track+'_'+step.id;area.value=readLocal(draftKey)||'';const row=el('div','editor-actions');const save=button('기록하고 다음으로','btn primary',()=>{const answer=area.value.trim();if(!answer)return;const success=updateNote(n,x=>{x.tracks[track].visited.push(step.id);x.tracks[track].answers[step.id]=answer;x.entries.push({id:uid(),body:answer,created:Date.now(),label:step.q});if(!stepNext(x,track))x.tracks[track].finished=true});if(!success)return;eraseLocal(draftKey);show(n.tracks[track].finished?'complete':'question');toast('생각을 남겼어')},'arrow',true);save.disabled=!area.value.trim();area.addEventListener('input',()=>{save.disabled=!area.value.trim();writeLocal(draftKey,area.value)});append(row,el('span','smallhint','답을 꼭 잘 쓸 필요는 없어'),save);append(editor,area,row);qc.append(editor);root.append(qc);
const tools=el('div','belowtools');append(tools,button('이 질문 건너뛰기','',()=>{if(updateNote(n,x=>{x.tracks[track].visited.push(step.id);if(!stepNext(x,track))x.tracks[track].finished=true})){eraseLocal(draftKey);show(n.tracks[track].finished?'complete':'question')}}),button('여기서 마무리','finish',()=>{if(updateNote(n,x=>x.tracks[track].finished=true)){show('complete');toast('이번 탐색을 마무리했어')}}));root.append(tools)}
function complete(){const n=current();if(!n||!tracks[track]){show('choose');return}const conf=tracks[track],t=n.tracks[track],count=Object.keys(t.answers).length;setNav('기록 보기',()=>show('detail'));root.append(back('발전 방향',()=>show('choose')));
const box=el('section','complete');const emblem=el('div','complete-emblem');emblem.append(svg('circle'));append(box,emblem,el('h1','', t.finished?'이번 생각 탐색을 마쳤어.':'여기까지 생각해 봤어.'),el('p','complete-lead',`${conf.name}에서 ${count}개의 생각을 남겼어.\n이제 더 질문하지 않아도 돼. 기록은 계속 남아 있어.`));box.querySelector('.complete-lead').style.whiteSpace='pre-line';
const answers=conf.steps.filter(s=>t.answers[s.id]);if(answers.length){box.append(el('h2','sectiontitle','이번에 남긴 생각'));answers.forEach(s=>{const card=el('div','summary-item');append(card,el('div','q',s.q),el('div','a',t.answers[s.id]));box.append(card)})}else box.append(el('div','empty','아직 적어둔 답변은 없어. 언제든 다시 이어갈 수 있어.'));
const actions=el('div','complete-actions');append(actions,button('내 기록으로 돌아가기','btn primary btn-wide',()=>show('detail'),'check'),button('다른 방향에서 더 생각해보기','btn secondary btn-wide',()=>show('choose')));
const remain=stepNext(n,track);if(remain){actions.append(button('남은 질문 이어서 보기','btn ghost btn-wide',()=>{if(updateNote(n,x=>x.tracks[track].finished=false))show('question')}))}box.append(actions,el('p','finishhint','질문은 자동으로 반복되지 않아. 더 떠오른 생각은 기록 상세 화면에서 자유롭게 덧붙일 수 있어.'));root.append(box)}
function noteText(n){let out=`[처음의 생각]\n${n.body}`;if(n.entries.length){out+='\n\n[이어진 생각]';n.entries.forEach(e=>{out+=`\n\n${e.label}\n${e.body}`})}return out}
async function copyText(v){try{if(!navigator.clipboard?.writeText)throw Error('unsupported');await navigator.clipboard.writeText(v);toast('내용을 복사했어')}catch(e){const textarea=el('textarea');textarea.value=v;textarea.style.position='fixed';textarea.style.opacity='0';document.body.append(textarea);textarea.select();let ok=false;try{ok=document.execCommand('copy')}catch(err){}textarea.remove();if(ok)toast('내용을 복사했어');else prompt('아래 내용을 복사해 줘',v)}}
function backup(){const data=JSON.stringify({app:'moru',version:7,exportedAt:new Date().toISOString(),notes},null,2);const blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`moru-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('백업 파일을 만들었어')}
document.getElementById('restore-input').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>8*1024*1024)throw Error('파일 크기가 너무 커.');const raw=JSON.parse(await file.text());if(raw.app!=='moru'||!Array.isArray(raw.notes))throw Error('Moru 백업 파일이 아니야.');const incoming=raw.notes.map(cleanNote).filter(Boolean);if(!confirm(`백업에서 ${incoming.length}개의 기록을 불러올까? 현재 기록은 지우지 않고 합쳐져.`))return;const ids=new Set(notes.map(n=>n.id)),added=incoming.filter(n=>!ids.has(n.id));const old=notes;notes=[...added,...notes];if(!persist()){notes=old;throw Error('저장에 실패했어.')}searchValue='';show('library');toast(`${added.length}개 기록을 불러왔어`)}catch(err){alert('백업 파일을 불러오지 못했어. '+err.message)}});
bootstrap();render();
})();
