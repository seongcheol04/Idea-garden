<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><title>moru. — 생각을 남기다</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#34463b;background:#faf9f5}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.app{max-width:620px;margin:auto;min-height:100dvh;padding:30px 22px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}.brand{font-family:Georgia,serif;font-size:30px;letter-spacing:-1.4px;font-weight:bold;color:#526e59}.link{border:0;background:none;color:#7b8c7e;font-size:14px;padding:10px 0}.main-title{font-size:25px;letter-spacing:-.8px;font-weight:600;line-height:1.5;margin:0 0 25px}.entry{background:white;border:1px solid #e9ede6;border-radius:20px;padding:18px;box-shadow:0 8px 28px #314c3310}textarea{border:0;resize:vertical;outline:0;width:100%;color:#34463b;line-height:1.8;background:transparent;font-size:16px;min-height:135px}textarea::placeholder{color:#abb7ac}.actions{display:flex;justify-content:flex-end;align-items:center;margin-top:14px}.primary{border:0;border-radius:13px;background:#718f76;color:white;padding:12px 21px;font-size:14px;font-weight:600}.primary:hover{background:#5e7d64}.subtle{border:1px solid #dfe7dd;border-radius:12px;background:white;color:#617765;padding:10px 14px;font-size:14px}.muted{color:#97a299;font-size:13px}.center{text-align:center}.toast{margin:18px 0;color:#66836b;text-align:center;font-size:13px;min-height:20px}.list{display:grid;gap:11px}.note{background:white;border:1px solid #ebeee8;border-radius:16px;padding:19px;text-align:left;color:#34463b;line-height:1.7;width:100%;white-space:pre-wrap;word-break:break-word}.note small{display:block;color:#9ca99f;margin-bottom:9px;font-size:12px}.back{margin-bottom:26px}.detail{background:white;border:1px solid #e8ede6;border-radius:20px;padding:24px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.detail .muted{display:block;margin-bottom:15px}.section{margin-top:35px}.section-title{font-size:15px;color:#617765;margin-bottom:15px;font-weight:600}.growth{border-left:2px solid #d9e5d9;margin:0 0 14px 9px;padding:2px 0 2px 17px;white-space:pre-wrap;overflow-wrap:anywhere}.growth small{display:block;color:#9ba89e;margin-bottom:5px}.question{font-size:21px;font-weight:600;line-height:1.55;margin:8px 0 18px}.hint{font-size:13px;color:#8d9a90;line-height:1.7}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.divider{border:0;border-top:1px solid #e5ebe3;margin:28px 0}.empty{padding:65px 0;color:#a0aca2;text-align:center}.smallarea{min-height:100px}.footer{margin-top:35px;font-size:12px;color:#9da99e}.danger{color:#a87474}.spacer{height:10px}@media(max-width:400px){.app{padding:23px 17px 60px}.top{margin-bottom:56px}.main-title{font-size:23px}}
</style></head><body><main class="app"><header class="top"><div class="brand">moru.</div><button id="nav" class="link"></button></header><div id="root"></div></main><script>
(()=>{'use strict';const KEY='moru_v6_notes',DRAFT='moru_v6_draft';let notes=[],screen='write',active=null,question=null,toastTimer;const root=document.getElementById('root'),nav=document.getElementById('nav');const qs=[{id:'origin',text:'이 생각이 떠오른 계기가 있어?',hint:'직접 겪은 일이나 관찰한 장면을 떠올려봐.'},{id:'problem',text:'이 생각이 해결하려는 불편은 무엇일까?',hint:'누군가 실제로 겪는 문제를 생각해봐.'},{id:'people',text:'이 문제를 가장 크게 느낄 사람은 누구일까?',hint:'한 사람을 구체적으로 떠올려도 좋아.'},{id:'core',text:'가장 중요한 부분 하나만 남긴다면?',hint:'작게 시작할 수 있는 방법을 찾아봐.'},{id:'difference',text:'이미 있는 방법과 무엇이 달라질까?',hint:'아직 모르겠다면 넘어가도 돼.'},{id:'test',text:'이 생각이 쓸모 있는지 어떻게 확인할까?',hint:'작은 실험 하나면 충분해.'},{id:'obstacle',text:'실제로 만들 때 가장 어려운 점은 뭘까?',hint:'기술, 비용, 사람, 시간 중 무엇이 걸릴까?'},{id:'alternative',text:'다른 방식으로 접근한다면?',hint:'기존 방식과 반대로 생각해봐.'}];function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function btn(txt,cls,fn){const x=el('button',cls,txt);x.type='button';x.addEventListener('click',fn);return x}function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){alert('저장에 실패했어. 브라우저 저장 공간이나 설정을 확인해줘.');return false}}try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(raw)?raw.filter(n=>n&&typeof n.id==='string'&&typeof n.body==='string').map(n=>({...n,growth:Array.isArray(n.growth)?n.growth:[],skipped:Array.isArray(n.skipped)?n.skipped:[]})):[]}catch(e){notes=[]}function fmt(t){return new Date(t).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit'})}function navset(label,fn){nav.textContent=label;nav.onclick=fn}function clear(){root.replaceChildren()}function heading(t){root.append(el('h1','main-title',t))}function go(s,id){screen=s;if(id)active=id;render()}function notice(t){const e=document.getElementById('toast');if(e){e.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(e.isConnected)e.textContent=''},2300)}}function current(){return notes.find(n=>n.id===active)}function render(){clear();if(screen==='write')write();else if(screen==='list')list();else if(screen==='detail')detail();else if(screen==='grow')grow()}function write(){navset('기록 보기  ↗',()=>go('list'));heading('지금 무슨 생각이 떠올랐어?');const card=el('div','entry');const area=el('textarea');area.placeholder='그냥 생각나는 대로 적어봐.';area.setAttribute('aria-label','새로운 생각');try{area.value=localStorage.getItem(DRAFT)||''}catch(e){}area.addEventListener('input',()=>{submit.disabled=!area.value.trim();try{localStorage.setItem(DRAFT,area.value)}catch(e){}});card.append(area);const actions=el('div','actions');const submit=btn('기록하기','primary',()=>{const body=area.value.trim();if(!body)return;const n={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),body,created:Date.now(),growth:[],skipped:[]};notes.unshift(n);if(!save()){notes.shift();return}area.value='';try{localStorage.removeItem(DRAFT)}catch(e){}submit.disabled=true;notice('생각을 남겼어 ✓');area.focus()});submit.disabled=!area.value.trim();actions.append(submit);card.append(actions);root.append(card,el('div','toast'),el('p','muted center','기록만 해도 충분해. 나중에 다시 꺼내보면 돼.'))}function list(){navset('＋ 새 기록',()=>go('write'));heading('남겨둔 생각들');if(!notes.length){root.append(el('div','empty','아직 기록이 없어.'));return}const l=el('div','list');notes.forEach(n=>{const b=btn('','note',()=>go('detail',n.id));b.append(el('small','',fmt(n.created)));b.append(el('span','',n.body.length>145?n.body.slice(0,145)+'…':n.body));if(n.growth.length)b.append(el('small','',`이어 쓴 생각 ${n.growth.length}개`));l.append(b)});root.append(l)}function detail(){const n=current();if(!n){go('list');return}navset('기록 목록',()=>go('list'));root.append(el('p','muted','처음 남긴 생각'));const card=el('div','detail');card.append(el('span','muted',fmt(n.created)),el('div','',n.body));root.append(card);if(n.growth.length){const sec=el('section','section');sec.append(el('div','section-title','이어 쓴 생각'));n.growth.forEach(g=>{const e=el('div','growth');e.append(el('small','',g.question||'자유롭게 이어 쓰기'),el('div','',g.body));sec.append(e)});root.append(sec)}const s=el('section','section');s.append(btn('생각 이어가기 →','primary',()=>go('grow')));const r=el('div','row');r.style.marginTop='24px';r.append(btn('내용 복사','subtle',()=>{const text=[n.body,...n.growth.map(g=>`${g.question||'추가 생각'}\n${g.body}`)].join('\n\n');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert('복사했어')).catch(()=>prompt('아래 내용을 복사해줘',text));else prompt('아래 내용을 복사해줘',text)}),btn('삭제','link danger',()=>{if(confirm('이 기록과 이어 쓴 생각을 모두 삭제할까?')){notes=notes.filter(x=>x.id!==n.id);save();go('list')}}));s.append(r);root.append(s)}function pick(n){const answered=new Set(n.growth.map(g=>g.qid).filter(Boolean));return qs.find(q=>!answered.has(q.id)&&!n.skipped.includes(q.id))||null}function grow(){const n=current();if(!n){go('list');return}navset('← 기록으로',()=>go('detail'));root.append(el('p','muted','처음 남긴 생각'));const origin=el('div','detail',n.body);root.append(origin);const section=el('section','section');section.append(el('div','section-title','생각을 이어가 볼까?'));const q=pick(n);if(q){section.append(el('div','question',q.text),el('p','hint',q.hint))}else{section.append(el('div','question','새롭게 떠오른 생각이 있어?'),el('p','hint','준비한 질문은 모두 살펴봤어. 자유롭게 이어 써도 좋아.'))}const area=el('textarea','smallarea');area.placeholder='자유롭게 적어봐.';const card=el('div','entry');card.append(area);const row=el('div','actions');const savebtn=btn('생각 저장','primary',()=>{const body=area.value.trim();if(!body)return;n.growth.push({body,qid:q?.id||null,question:q?.text||null,created:Date.now()});if(!save()){n.growth.pop();return}go('detail')});savebtn.disabled=true;area.addEventListener('input',()=>savebtn.disabled=!area.value.trim());row.append(savebtn);card.append(row);section.append(card);const tools=el('div','row');tools.style.marginTop='17px';if(q)tools.append(btn('다른 질문','link',()=>{n.skipped.push(q.id);save();render()}));tools.append(btn('질문 없이 쓰기','link',()=>{section.querySelector('.question').textContent='새롭게 떠오른 생각이 있어?';section.querySelector('.hint').textContent='질문에 답하지 않아도 괜찮아.';savebtn.onclick=()=>{const body=area.value.trim();if(!body)return;n.growth.push({body,qid:null,question:null,created:Date.now()});if(!save()){n.growth.pop();return}go('detail')}}));section.append(tools);root.append(section)}render();})();
</script></body></html>
